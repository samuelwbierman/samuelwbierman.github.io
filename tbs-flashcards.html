<title>TBS Phase II Flashcards</title>

<style>
/* Layout: clean study app. Category list on the left (a dropdown on phones), one large card in the center with a progress bar, clear primary actions. */
:root {
  --bg: #F5F6F8;
  --surface: #FFFFFF;
  --card: #FFFFFF;
  --card-back: #F1F4FE;
  --ink: #16181D;
  --muted: #646A75;
  --line: #E2E5EA;
  --accent: #2652D9;
  --accent-ink: #FFFFFF;
  --accent-soft: #E8EDFC;
  --good: #11815B;
  --bad: #C2362B;
  --shadow-sm: 0 1px 2px rgba(22,24,29,.06);
  --shadow: 0 1px 2px rgba(22,24,29,.05), 0 12px 32px -8px rgba(22,24,29,.14);
  --radius: 14px;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0F1115; --surface: #171A20; --card: #1B1F26; --card-back: #1A2135;
    --ink: #ECEEF2; --muted: #9AA1AC; --line: #282C35;
    --accent: #7E9BFF; --accent-ink: #0D1530; --accent-soft: #1D2643;
    --good: #4FCB9A; --bad: #F08379;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.4);
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 14px 36px -10px rgba(0,0,0,.6);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { color-scheme: light; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
[hidden] { display: none !important; }
.wrap { max-width: 1160px; margin: 0 auto; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); padding-block: 28px 56px; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }

/* header */
header.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px 28px; margin-bottom: 28px; }
.brand h1 { font-family: var(--f-display); font-weight: 700; font-size: clamp(26px, 4vw, 36px); line-height: 1.1; margin: 0; letter-spacing: -.02em; text-wrap: balance; }
.brand p { margin: 6px 0 0; color: var(--muted); max-width: 60ch; }
.brand .code { display: inline-block; font-size: 12px; font-weight: 600; color: var(--accent); background: var(--accent-soft); padding: 3px 10px; border-radius: 999px; margin-bottom: 10px; }
.tally { display: flex; gap: 10px; flex-wrap: wrap; }
.tally > div { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; font-size: 12px; color: var(--muted); min-width: 104px; box-shadow: var(--shadow-sm); }
.tally b { display: block; font-family: var(--f-display); font-size: 22px; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; line-height: 1.2; }

/* layout */
.layout { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 32px; align-items: start; }
@media (max-width: 820px) { .layout { grid-template-columns: minmax(0,1fr); gap: 0; } .rail { display: none; } .picker { display: block !important; } }

.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); display: flex; flex-direction: column; gap: 20px; max-height: calc(100vh - 32px); overflow-y: auto; padding: 4px 4px 4px 0; }
.group h2 { font-size: 12px; font-weight: 600; color: var(--muted); margin: 0 0 6px; padding-left: 10px; }
.cat { display: flex; justify-content: space-between; align-items: center; gap: 8px; width: 100%; text-align: left; background: none; border: 0; padding: 7px 10px; border-radius: 9px; font-size: 14px; color: var(--ink); transition: background .15s; }
.cat:hover { background: var(--surface); }
.cat[aria-current="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.cat .n { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; min-width: 28px; text-align: center; }
.cat[aria-current="true"] .n { color: var(--accent); border-color: transparent; }
.cat.empty .label { color: var(--muted); }
.cat .flag { font-size: 11px; font-weight: 500; color: var(--muted); margin-left: 6px; }

.picker { display: none; margin-bottom: 18px; }
.picker label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
.picker select { width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); box-shadow: var(--shadow-sm); }

/* toolbar + buttons */
.toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.toolbar h2 { margin: 0; font-family: var(--f-display); font-size: 22px; font-weight: 700; letter-spacing: -.01em; text-wrap: balance; }
.seg { display: inline-flex; background: var(--line); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 6px 14px; font-size: 13px; font-weight: 500; border-radius: 8px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm); }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 9px 16px; border-radius: 10px; font-size: 14px; font-weight: 600; box-shadow: var(--shadow-sm); transition: border-color .15s, transform .1s; }
.btn:hover { border-color: var(--muted); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.07); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* progress */
.progress { height: 6px; background: var(--line); border-radius: 999px; overflow: hidden; margin-bottom: 16px; }
.progress span { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width .25s ease; }

/* flashcard */
.stage { perspective: 1600px; }
.flash { position: relative; width: 100%; min-height: 320px; border: 0; padding: 0; background: none; text-align: left; transform-style: preserve-3d; transition: transform .5s cubic-bezier(.2,.7,.2,1); display: grid; border-radius: var(--radius); }
.flash.flipped { transform: rotateY(180deg); }
.face { grid-area: 1 / 1; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: var(--radius); box-shadow: var(--shadow); padding: 28px 32px; display: flex; flex-direction: column; gap: 16px; min-width: 0; border: 1px solid var(--line); }
.face.front { background: var(--card); }
.face.back { background: var(--card-back); transform: rotateY(180deg); }
.face .meta { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; font-weight: 600; color: var(--muted); }
.face .meta span:last-child { color: var(--accent); }
.face .term { font-family: var(--f-display); font-size: clamp(22px, 3.4vw, 30px); font-weight: 600; line-height: 1.25; letter-spacing: -.01em; margin: auto 0; text-wrap: balance; overflow-wrap: anywhere; text-align: center; }
.face .def { font-size: 17px; line-height: 1.65; margin: auto 0; max-width: 68ch; overflow-wrap: anywhere; }
.face .hint { font-size: 12px; color: var(--muted); text-align: center; }
.byline { font-size: 12px; font-weight: 600; color: var(--accent); }
@media (prefers-reduced-motion: reduce) { .flash, .progress span, .cat { transition: none; } }

.controls { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; margin-top: 18px; }
.counter { font-family: var(--f-mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* list view */
.list { display: flex; flex-direction: column; gap: 10px; }
.item { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); gap: 8px 24px; padding: 16px 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.item .t { font-weight: 600; overflow-wrap: anywhere; }
.item .d { color: var(--ink); overflow-wrap: anywhere; }
.item .sub { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
@media (max-width: 600px) { .item { grid-template-columns: minmax(0,1fr); } }

.chip { font-size: 12px; font-weight: 500; padding: 2px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
.chip.cat-chip { background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
.mini { font-size: 12px; padding: 4px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); }

/* panels + form */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 26px; box-shadow: var(--shadow-sm); }
.panel h3 { margin: 0 0 6px; font-family: var(--f-display); font-size: 22px; font-weight: 700; letter-spacing: -.01em; text-wrap: balance; }
.panel .lede { margin: 0 0 20px; color: var(--muted); max-width: 62ch; }
.gate { box-shadow: var(--shadow); }
.form { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.form .full { grid-column: 1 / -1; }
@media (max-width: 600px) { .form { grid-template-columns: minmax(0,1fr); } }
.field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
.field .help { font-size: 12px; color: var(--muted); margin-top: 5px; }
.field input, .field textarea, .field select { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); transition: border-color .15s, box-shadow .15s; }
.field input:focus, .field textarea:focus, .field select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.field textarea { min-height: 100px; resize: vertical; }
.msg { font-size: 14px; margin: 12px 0 0; }
.msg.err { color: var(--bad); }
.msg.ok { color: var(--good); }
.example { margin-top: 20px; padding: 14px 16px; background: var(--accent-soft); border-radius: 10px; font-size: 14px; }
.example b { display: block; font-size: 13px; font-weight: 600; color: var(--accent); margin-bottom: 4px; }
.emptybox { padding: 32px; border: 1px dashed var(--line); border-radius: var(--radius); color: var(--muted); background: var(--surface); text-align: center; }
.emptybox strong { color: var(--ink); font-size: 16px; }
.spacer { height: 16px; }

/* edit + history */
.card-actions { margin-top: 14px; }
.item.active { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
#editPanel, #histPanel { scroll-margin-top: 16px; }
#editPanel { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.hist { display: flex; flex-direction: column; gap: 10px; }
.hist-item { display: flex; flex-direction: column; gap: 6px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); min-width: 0; }
.hist-item.current { background: var(--accent-soft); border-color: transparent; }
.hist-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; font-size: 12px; }
.hist-label { font-weight: 600; color: var(--ink); }
.hist-who { color: var(--muted); }
.hist-item .t { font-weight: 600; overflow-wrap: anywhere; }
.hist-item .d { overflow-wrap: anywhere; }
.mini { cursor: pointer; font-weight: 500; }
.mini:hover { border-color: var(--muted); }

/* phone overrides (kept last so they win) */
@media (max-width: 820px) { .rail { display: none; } .picker { display: block; } }
@media (max-width: 600px) { .tally { width: 100%; } .tally > div { flex: 1 1 0; min-width: 0; } }
</style>
</head>

"f": "Services (function)", "b": "Effective administration, management, and employment of military organizations; essentially administrative. Divided into Command Services (provided by your command) and CSS Services (provided by a CSS unit)."}, {"id": "b24", "c": "Logistics Fundamentals", "f": "Command services", "b": "Personnel administration, religious ministries support, financial management, communications, billeting, messing, band, MWR."}, {"id": "b25", "c": "Logistics Fundamentals", "f": "CSS services", "b": "Disbursing, postal, exchange services, security support, legal services support, civil affairs support, graves registration."}, {"id": "b26", "c": "Classes of Supply", "f": "Class I", "b": "Subsistence. Subclasses: A (air/inflight rations), C (combat rations), R (refrigerated), S (nonrefrigerated)."}, {"id": "b27", "c": "Classes of Supply", "f": "Class II", "b": "Clothing, individual equipment, tentage, organizational tool sets/kits, hand tools, admin & housekeeping supplies. Subclasses: B, E, F, M, T."}, {"id": "b28", "c": "Classes of Supply", "f": "Class III", "b": "Petroleum, oils & lubricants (POL): fuels, lubricants, hydraulic oils, coolants, compressed gases, antifreeze, etc. Subclasses: A (air), W (ground)."}, {"id": "b29", "c": "Classes of Supply", "f": "Class IV", "b": "Construction materiel, including installed equipment and all fortification and barrier materiel. No subclasses."}, {"id": "b30", "c": "Classes of Supply", "f": "Class V", "b": "Ammunition of all types - bombs, explosives, mines, fuzes, detonators, pyrotechnics, missiles, rockets, propellants. Subclasses: A (air), W (ground)."}, {"id": "b31", "c": "Classes of Supply", "f": "Class VI", "b": "Personal demand items and nonmilitary sales items. No subclasses."}, {"id": "b32", "c": "Classes of Supply", "f": "Class VII", "b": "Major end items - final assembled products ready for use (launchers, tanks, vehicles, mobile machine shops). Subclasses: A, B, D, G, K, L, M, N."}, {"id": "b33", "c": "Classes of Supply", "f": "Class VIII", "b": "Medical materiel, including repair parts unique to medical materiel. Subclasses: A (medical/dental), B (blood & blood products)."}, {"id": "b34", "c": "Classes of Supply", "f": "Class IX", "b": "Repair parts - components, kits, assemblies, subassemblies (repairable and non-repairable) for maintenance of all equipment."}, {"id": "b35", "c": "Classes of Supply", "f": "Class X", "b": "Nonmilitary materiel supporting nonmilitary programs (e.g., agriculture, economic development) not included in Classes I-IX."}, {"id": "b36", "c": "Classes of Supply", "f": "Which class? MREs", "b": "Class I (subclass C - combat rations)."}, {"id": "b37", "c": "Classes of Supply", "f": "Which class? Water", "b": "Class I (subsistence) - computed with the water formula P x D x R x 1.1."}, {"id": "b38", "c": "Classes of Supply", "f": "Which class? CLP / lubricants / fuel", "b": "Class III (POL)."}, {"id": "b39", "c": "Classes of Supply", "f": "Which class? Tentage, CP tent, hand tools", "b": "Class II. NOTE: the B2G3217 flowchart wrongly labels tentage as Class 9 - the class table and B2F0600XQ say Class 2."}, {"id": "b40", "c": "Classes of Supply", "f": "Which class? Sandbags, concertina, barrier materiel", "b": "Class IV."}, {"id": "b41", "c": "Classes of Supply", "f": "Which class? Pyrotechnics, grenades, demo", "b": "Class V."}, {"id": "b42", "c": "Classes of Supply", "f": "Which class? PX items, personal demand items", "b": "Class VI."}, {"id": "b43", "c": "Classes of Supply", "f": "Which class? A HMMWV or a tank", "b": "Class VII (major end item)."}, {"id": "b44", "c": "Classes of Supply", "f": "Which class? Blood products, malaria prophylaxis", "b": "Class VIII."}, {"id": "b45", "c": "Classes of Supply", "f": "Which class? A replacement alternator for a 7-ton", "b": "Class IX (repair parts)."}, {"id": "b46", "c": "Classes of Supply", "f": "Supply cycle", "b": "Procurement, use, and replenishment. Shorter cycle = more intensive management and transportation effort; longer cycle = more forward planning and storage."}, {"id": "b47", "c": "Classes of Supply", "f": "Phases of supply support (who performs tactical supply)", "b": "The LCE and ACE, through forecasting, requisitioning, receiving, storing, stock control, shipping, disposition, identifying, and accounting. Tactical supply runs from receipt of finished supplies to issue to the user."}, {"id": "b48", "c": "Maintenance", "f": "Two levels of maintenance (MARADMIN 159/13)", "b": "Field and Depot."}, {"id": "b49", "c": "Maintenance", "f": "Field level maintenance", "b": "Any maintenance not requiring depot capability; done by crews, operators, and mechanics/technicians in Marine units or approved contract sources. Two categories: Organizational and Intermediate."}, {"id": "b50", "c": "Maintenance", "f": "Two categories of field level maintenance", "b": "Organizational and Intermediate."}, {"id": "b51", "c": "Maintenance", "f": "Organizational maintenance", "b": "Typically performed by equipment operators, crews, and unit equipment technicians at the USING unit level."}, {"id": "b52", "c": "Maintenance", "f": "Intermediate maintenance", "b": "Typically performed at units task-organized to provide specialized maintenance support. (A commander may direct org or intermediate tasks if the unit has the trained people and equipment.)"}, {"id": "b53", "c": "Maintenance", "f": "Depot level maintenance", "b": "Major overhaul or rebuild. Not defined by location (e.g., MCLB Albany GA, Barstow CA, other service depots, commercial facilities, OEMs). Always specifically authorized and directed."}, {"id": "b54", "c": "Maintenance", "f": "Four phases of maintenance", "b": "1) Acceptance of equipment 2) Equipment induction 3) Active maintenance 4) Maintenance closeout."}, {"id": "b55", "c": "Maintenance", "f": "Acceptance of equipment phase", "b": "Initial step: acceptance inspection, scheduling, and assignment."}, {"id": "b56", "c": "Maintenance", "f": "Equipment induction phase", "b": "Physical commitment of the maintenance service request and equipment to a specific maintenance section; priority set in acceptance IAW the priority requested by the owning unit."}, {"id": "b57", "c": "Maintenance", "f": "Steps of active maintenance (5)", "b": "A) Inspection of equipment B) Preparation for maintenance actions C) Performance of maintenance D) Quality control E) Cleanup of maintenance area."}, {"id": "b58", "c": "Maintenance", "f": "Maintenance closeout phase", "b": "Begins when equipment is repaired and returned to the owner, or when a decision is made to evacuate or dispose of it."}, {"id": "b59", "c": "Maintenance", "f": "PMCS", "b": "Preventive Maintenance Checks and Services: systematic inspecting, cleaning, servicing, lubricating, adjusting. Key to readiness. The owning/using unit schedules and ensures completion."}, {"id": "b60", "c": "Maintenance", "f": "Preventive vs corrective maintenance", "b": "Preventive keeps materiel serviceable; corrective returns materiel to serviceable condition."}, {"id": "b61", "c": "Logistics Planning Considerations", "f": "Transportation planner sequence (MCWP 4-11, 6 steps)", "b": "1) Determine desired arrival time (backwards plan) 2) Select mode 3) Determine load/pickup, intermediate/transfer, offload/drop points 4) Apply time/distance factors 5) Reconcile conflicting requirements for limited assets 6) Test plan for feasibility."}, {"id": "b62", "c": "Logistics Planning Considerations", "f": "Main elements of transportation planning", "b": "Requirements list, lift mode, routing, timing."}, {"id": "b63", "c": "Logistics Planning Considerations", "f": "Transportation planning steps (flowchart)", "b": "Determine requirements -> Determine resources -> Balance requirements and resources -> Determine critical points -> Coordinating."}, {"id": "b64", "c": "Logistics Planning Considerations", "f": "Most time-consuming step of transportation planning", "b": "Balance requirements and resources (must include C2 and transportation unit support, not just gross cargo)."}, {"id": "b65", "c": "Logistics Planning Considerations", "f": "Key to transportation scheduling", "b": "Flexibility."}, {"id": "b66", "c": "Logistics Planning Considerations", "f": "Basic limitations to transportation timeliness", "b": "Required delivery date; time items are available at origin; time/distance factors; throughput capacity of facilities; capacity/security of staging bases and depots; terrain, climate, environment."}, {"id": "b67", "c": "Logistics Planning Considerations", "f": "General engineering planning considerations", "b": "Heavy equipment (slow, needs trained operators); transportation; construction materials (minimize multiple handling); supply/maintenance/ordnance support for low-density items; utilities support (water, fuel, power - big footprint, heat, noise, hard to camouflage)."}, {"id": "b68", "c": "Logistics Planning Considerations", "f": "Health services planning considerations", "b": "Enough medical supplies; casualty tracking; CASEVAC plan out of the AO; higher echelon facilities located; preventive medicine techs; mass casualty procedures; casualty receiving & treatment ships (amphib); area-specific requirements (malaria prophylaxis, immunizations)."}, {"id": "b69", "c": "Logistics Planning Considerations", "f": "Services planning factors common to all services functions", "b": "Responsibility and chain of command."}, {"id": "b70", "c": "CSS Across the MAGTF", "f": "Four core elements of the MAGTF", "b": "Command Element (CE), Ground Combat Element (GCE), Aviation Combat Element (ACE), Logistics Combat Element (LCE). They are categories of forces, not formal commands."}, {"id": "b71", "c": "CSS Across the MAGTF", "f": "Command Element", "b": "MAGTF headquarters: commander, staff, HQ section, communications, intelligence, and reconnaissance forces. Provides C2, intel, and other support."}, {"id": "b72", "c": "CSS Across the MAGTF", "f": "Ground Combat Element", "b": "Task-organized for ground operations; usually built around infantry; from a small unit to one or more divisions."}, {"id": "b73", "c": "CSS Across the MAGTF", "f": "Six functions of Marine aviation (ACE)", "b": "Anti-air warfare, offensive air support, assault support, electronic warfare, air reconnaissance, control of aircraft and missiles."}, {"id": "b74", "c": "CSS Across the MAGTF", "f": "Logistics Combat Element", "b": "Task-organized to provide CSS (supply, maintenance, transportation, general engineering, health services, services); from a detachment to one or more MLGs."}, {"id": "b75", "c": "CSS Across the MAGTF", "f": "MEF", "b": "Marine Expeditionary Force - the largest MAGTF and principal Marine warfighting organization. I MEF (Camp Pendleton): 1st MarDiv (GCE), 3d MAW (ACE), 1st MLG (LCE)."}, {"id": "b76", "c": "CSS Across the MAGTF", "f": "Marine Division CSS capabilities", "b": "Depends on the LCE but has robust organic logistics that should be used BEFORE requesting outside support: Division G-4, two truck companies under HQ Bn, Regimental and Battalion S-4s. Capability decreases further down the hierarchy."}, {"id": "b77", "c": "CSS Across the MAGTF", "f": "MAW CSS - two principal units", "b": "Marine Aviation Logistics Squadron (MALS) and Marine Wing Support Squadron (MWSS). MAW depends on the LCE for ground CSS and bulk aviation commodities."}, {"id": "b78", "c": "CSS Across the MAGTF", "f": "MWSS provides", "b": "Internal airfield comms, weather, expeditionary airfield services, aircraft rescue & firefighting, essential engineering, motor transport, field mess, medical, personnel training, NBC defense, security, air base commandant functions, EOD."}, {"id": "b79", "c": "CSS Across the MAGTF", "f": "MALS provides", "b": "Maintenance beyond the flying squadron's capability; aircraft supply support; assembling/distributing aviation ammunition; supply support to MWSS expeditionary airfield and weather sections."}, {"id": "b80", "c": "CSS Across the MAGTF", "f": "Mission of the MLG", "b": "Direct support to the MEF GCE and general support / sustained tactical-level logistics above the organic capabilities of supported elements."}, {"id": "b81", "c": "CSS Across the MAGTF", "f": "MLG composition", "b": "HQ for C2, a direct support CLR, a general support CLR, an Engineer Support Battalion, and a Dental Battalion."}, {"id": "b82", "c": "CSS Across the MAGTF", "f": "Direct support (DS) mission - request priority", "b": "1) Supported unit 2) Higher CSS HQ 3) Own units."}, {"id": "b83", "c": "CSS Across the MAGTF", "f": "Direct support (DS) mission - liaison, comms, positioning", "b": "PROVIDES liaison personnel to the supported unit; establishes comms with supported unit and higher CSS HQ; POSITIONED BY THE SUPPORTED UNIT."}, {"id": "b84", "c": "CSS Across the MAGTF", "f": "General support (GS) mission - request priority", "b": "1) Higher CSS HQ 2) Supported units 3) Own units."}, {"id": "b85", "c": "CSS Across the MAGTF", "f": "General support (GS) mission - liaison, comms, positioning", "b": "ESTABLISHES liaison with supported units; comms with supported units and higher CSS HQ; POSITIONED BY HIGHER CSS HQ."}, {"id": "b86", "c": "Requesting Support & Planning Factors", "f": "Four logistics planning concepts (MCWP 4-11 ch 4)", "b": "1) Logistics planning is concurrent with operations planning 2) Exploit organic logistic capabilities before requesting CSS support 3) The impetus of logistics is from the rear, directly to the using unit 4) The logistics system must be responsive, effective, and efficient."}, {"id": "b87", "c": "Requesting Support & Planning Factors", "f": "LSR / TSR", "b": "Logistics Support Request / Training Support Request - a common template that streamlines the request from requesting unit to supporting unit."}, {"id": "b88", "c": "Requesting Support & Planning Factors", "f": "Sections of a sample LSR", "b": "Header (event, location, DOD/ETD, DOR/ETR, POC, unit, TGT #); Chow (hot box, MRE, wet); Medical (corpsmen); Motor transport; Water bull; Ammo (DODIC, nomenclature, qty); Armory; Port-o-john; requester and S-4 rep signatures."}, {"id": "b89", "c": "Requesting Support & Planning Factors", "f": "DODIC", "b": "DoD Identification Code - the code used to request a specific ammunition item on the LSR (e.g., A059 = 5.56mm ball; G881 = M67 frag grenade)."}, {"id": "b90", "c": "Requesting Support & Planning Factors", "f": "LSR request flow (infantry battalion)", "b": "Platoon generates LSR -> Company reviews, identifies what it can't support -> Bn S-4 (maximize organic first) -> Regt S-4 -> LCE unit or Division G-4 for sourcing -> support routed back -> distributed to platoon by Battalion logistics trains."}, {"id": "b91", "c": "Requesting Support & Planning Factors", "f": "Battalion S-4", "b": "Staff section whose primary responsibility is supporting the CSS requirements of the command. Includes 0402 logistics officers, maintenance management, embark, small arms and electro-optical repair, ammo techs, motor T mechanics/operators, and field mess."}, {"id": "b92", "c": "Requesting Support & Planning Factors", "f": "Who in the platoon submits the LSR?", "b": "You (or the platoon sergeant / company GySgt) submit it to the Battalion S-4 via company."}, {"id": "b93", "c": "Requesting Support & Planning Factors", "f": "Requirements determination process (3 steps)", "b": "1) Obtain friendly force information requirements (FFIRs) 2) Acquire the appropriate planning factors 3) Compute the requirements."}, {"id": "b94", "c": "Requesting Support & Planning Factors", "f": "Planning factors", "b": "Measures of consumption or usage - how much of a commodity is used, or how much equipment is operated, in a time period."}, {"id": "b95", "c": "Requesting Support & Planning Factors", "f": "Usage data", "b": "Hard, verified information on consumption or hours of operation of a particular unit in a specific environment."}, {"id": "b96", "c": "Requesting Support & Planning Factors", "f": "Standard planning factors", "b": "From official publications: MCOs, MCWPs, MCRPs, TMs, unit historical records, validated AARs."}, {"id": "b97", "c": "Requesting Support & Planning Factors", "f": "Nonstandard planning factors", "b": "From expert opinion and non-validated data - the 'art' of logistics."}, {"id": "b98", "c": "Requesting Support & Planning Factors", "f": "Class I ration formula", "b": "(P x D x M) / Ur = R. P = personnel, D = days, M = meals per day, Ur = rations per case, R = cases required."}, {"id": "b99", "c": "Requesting Support & Planning Factors", "f": "Class I water formula", "b": "P x D x R x 1.1 = W. P = personnel, D = days, R = gallons per man per day, 1.1 = 10% waste, W = total gallons."}, {"id": "b100", "c": "Requesting Support & Planning Factors", "f": "Class III fuel formula (gallons per hour)", "b": "E x D x R x H = G. E = equipment density, D = days, R = gallons per hour, H = hours operated per day, G = gallons."}, {"id": "b101", "c": "Requesting Support & Planning Factors", "f": "Class III fuel formula (miles per gallon)", "b": "(Di / M) x E x F = G. Di = distance, M = MPG, E = equipment density, F = number of times the distance is driven, G = gallons."}, {"id": "b102", "c": "Requesting Support & Planning Factors", "f": "Sample 1: 2,945 Marines, 10 days, 3 MREs/day, 12 per case, 48 cases/pallet", "b": "(2,945 x 10 x 3) / 12 = 7,362.5 -> round UP to 7,363 cases (about 153.4 -> 154 pallets). The handout leaves it at 7,362.5."}, {"id": "b103", "c": "Requesting Support & Planning Factors", "f": "Sample 2: 100 Marines, 5 days, arctic, 2.0 gal/man/day drinking", "b": "100 x 5 x 2.0 x 1.1 = 1,100 gallons TOTAL for the 5 days (the handout mislabels it 'per day')."}, {"id": "b104", "c": "Requesting Support & Planning Factors", "f": "Sample 3: 50 HMMWVs, 30 days, 125 mi/day, 10 MPG", "b": "(125 / 10) x 50 x 30 = 18,750 gallons. Using GPH instead (50 x 30 x 6 x 8) gives 72,000 gallons - why you must apply judgment."}, {"id": "b105", "c": "Requesting Support & Planning Factors", "f": "Why technical manual fuel rates can mislead (art of logistics)", "b": "TM GPH assumes 60 mph travel; ignores idle time; ignores cargo load; ignores terrain steepness. Use historical factors, experience, and SME advice."}, {"id": "b106", "c": "Requesting Support & Planning Factors", "f": "Arctic water planning factors (company, sustaining)", "b": "Drinking 2.0, hygiene 1.7, field feeding 1.3 gal/man/day; total with 10% waste 8.3."}, {"id": "b107", "c": "Fire Support Planning Basics", "f": "Fire support planning", "b": "The continuous and concurrent process of analyzing, allocating, and scheduling fire support and integrating it with maneuver to maximize combat power."}, {"id": "b108", "c": "Fire Support Planning Basics", "f": "Two purposes of fire support planning", "b": "1) Achieve effectiveness and efficiency from fire support assets in meeting the force's requirements 2) Determine the proper allocation of fire support."}, {"id": "b109", "c": "Fire Support Planning Basics", "f": "13 principles of fire support planning", "b": "Plan early & continuously; exploit all targeting assets; consider all available fires; use lowest echelon capable; use most effective means; furnish type requested; avoid unnecessary duplication; coordinate airspace; provide adequate support; provide rapid coordination; provide safeguards & survivability; establish FSCMs; establish comm support."}, {"id": "b110", "c": "Fire Support Planning Basics", "f": "Three themes of fire support planning", "b": "1) The FS plan must support the scheme of maneuver 2) The maneuver leader must provide bottom-up refinement 3) The FS plan must be executable (simplicity)."}, {"id": "b111", "c": "Fire Support Planning Basics", "f": "When are fires planned relative to the SOM?", "b": "After the scheme of maneuver is determined - fires are in a supporting role."}, {"id": "b112", "c": "Mortars & Artillery", "f": "M224A1 60mm mortar - organization", "b": "3 tubes = mortar section, organic to the infantry RIFLE COMPANY. Fired drop or trigger mode; can be handheld; direct lay or via FDC."}, {"id": "b113", "c": "Mortars & Artillery", "f": "60mm - max range", "b": "3,500 m."}, {"id": "b114", "c": "Mortars & Artillery", "f": "60mm - ECR / planning width", "b": "30 m."}, {"id": "b115", "c": "Mortars & Artillery", "f": "60mm - rates of fire", "b": "Max 30 rds/min; sustained 20 rds/min."}, {"id": "b116", "c": "Mortars & Artillery", "f": "60mm - weight", "b": "37 lbs with M7A1 baseplate; 33 lbs with M8A1; 17 lbs handheld."}, {"id": "b117", "c": "Mortars & Artillery", "f": "M252A1 81mm mortar - organization", "b": "4 tubes = section; 2 sections (8 tubes) = mortar platoon, organic to the infantry BATTALION. Cannot be fired handheld; normally uses an FDC."}, {"id": "b118", "c": "Mortars & Artillery", "f": "81mm - max range", "b": "5,800 m."}, {"id": "b119", "c": "Mortars & Artillery", "f": "81mm - ECR / planning width", "b": "35 m."}, {"id": "b120", "c": "Mortars & Artillery", "f": "81mm - rates of fire", "b": "Max 30 rds/min; sustained 15 rds/min."}, {"id": "b121", "c": "Mortars & Artillery", "f": "81mm - weight", "b": "78 lbs (integrated blast attenuator) / 82 lbs (removable)."}, {"id": "b122", "c": "Mortars & Artillery", "f": "Mortar capabilities", "b": "High volume of fire; highly responsive; light, mobile, flexible; fire from/into defilade; the CO's 'hip pocket artillery' (organic, habitual relationship)."}, {"id": "b123", "c": "Mortars & Artillery", "f": "Mortar limitations", "b": "Long time of flight (and vulnerable to direction-finding radar); high ammo consumption (smaller ECR); multiple displacements due to short range."}, {"id": "b124", "c": "Mortars & Artillery", "f": "M777A2 155mm howitzer - formations", "b": "Regiment 54 guns, battalion 18, battery 6, platoon 3."}, {"id": "b125", "c": "Mortars & Artillery", "f": "M777A2 - max range", "b": "22.5 km standard; 30 km with RAP; 37.5 km with Excalibur (GPS-guided)."}, {"id": "b126", "c": "Mortars & Artillery", "f": "M777A2 - ECR / planning width", "b": "50 m."}, {"id": "b127", "c": "Mortars & Artillery", "f": "M777A2 - rates of fire", "b": "Max 4 rds/min for 2 min; sustained 2 rds/min."}, {"id": "b128", "c": "Mortars & Artillery", "f": "M777A2 - weight", "b": "9,840 lbs."}, {"id": "b129", "c": "Mortars & Artillery", "f": "M142 HIMARS - purpose", "b": "Highly mobile rapid-fire rocket and guided missile system to complement cannon artillery, attack deep, and strike counterfire, air defense, and high-payoff targets."}, {"id": "b130", "c": "Mortars & Artillery", "f": "HIMARS ranges", "b": "GMLRS 15-84 km; ATACMS 70-300 km."}, {"id": "b131", "c": "Mortars & Artillery", "f": "HIMARS default rate of fire", "b": "5 sec between rockets; 15 sec between missiles."}, {"id": "b132", "c": "Mortars & Artillery", "f": "NMESIS", "b": "Navy-Marine Corps Expeditionary Ship Interdiction System - missile artillery supporting fleet operations and deterring competitors in key maritime terrain."}, {"id": "b133", "c": "Mortars & Artillery", "f": "Artillery capabilities", "b": "Maneuvering fires (shift without displacing); massing fires; surprise fires (no adjustment, needs accurate location); all-weather; fires from/into defilade; rapid displacement."}, {"id": "b134", "c": "Mortars & Artillery", "f": "Artillery limitations", "b": "Slow emplacement (can't fire while displacing except hip shoot); poor terrain; close combat; air attack; ammunition/logistics; can't support the initial phase of an amphibious assault; communications; enemy counter-battery radar."}, {"id": "b135", "c": "Mortars & Artillery", "f": "Hip shoot", "b": "A hasty, unplanned occupation of a firing position."}, {"id": "b136", "c": "Mortars & Artillery", "f": "Massing fires - why it matters", "b": "18 rounds landing at once cause more damage than 18 rounds landing 6 at a time, 20 seconds apart."}, {"id": "b137", "c": "Mortars & Artillery", "f": "Artillery ammo logistics fact", "b": "One MTVR 7-ton with M105 trailer carries 120 complete 155mm rounds; an artillery battalion can fire a truckload every minute."}, {"id": "b138", "c": "Mortars & Artillery", "f": "Who supports the initial phase of an amphibious assault?", "b": "Naval gunfire and air - artillery is still aboard ship or en route."}, {"id": "b139", "c": "Shells & Fuzes", "f": "HE (high explosive)", "b": "All systems. Comp B, IMX, or TNT fill. Destroys/casualties against personnel and light-skinned vehicles."}, {"id": "b140", "c": "Shells & Fuzes", "f": "WP (white phosphorous)", "b": "60/81/155. Screening, obscuring, incendiary (e.g., refueling sites), signaling/marking."}, {"id": "b141", "c": "Shells & Fuzes", "f": "Best shell for vehicles refueling", "b": "HE/WP: HE for the vehicles, WP for the fuel."}, {"id": "b142", "c": "Shells & Fuzes", "f": "RP (red phosphorous)", "b": "81mm. Like WP but gray smoke that billows faster, wider screen."}, {"id": "b143", "c": "Shells & Fuzes", "f": "Illumination burn times", "b": "60mm about 40 sec; 81mm about 60 sec; 155mm about 120 sec. Also used for signaling/marking."}, {"id": "b144", "c": "Shells & Fuzes", "f": "IR illumination", "b": "60/81/155. Illuminates the battlefield, visible only through NVGs."}, {"id": "b145", "c": "Shells & Fuzes", "f": "M825 smoke", "b": "155mm. 5-15 min of smoke from 116 WP-felt wedges. Optimal for screening/obscuring, NOT for marking."}, {"id": "b146", "c": "Shells & Fuzes", "f": "RAP", "b": "155mm rocket-assisted projectile; extends range to about 30 km (the handout's '30,100km' is a typo)."}, {"id": "b147", "c": "Shells & Fuzes", "f": "ICM / DPICM", "b": "155mm and HIMARS. Improved Conventional Munition (the handout misprints it as 'Improvised'): base-ejecting, 88 dual-purpose grenades (155mm); 404 in the M30 GMLRS. Used against armor; produces duds."}, {"id": "b148", "c": "Shells & Fuzes", "f": "Excalibur", "b": "M982 extended-range GPS-guided 155mm projectile (37.5 km)."}, {"id": "b149", "c": "Shells & Fuzes", "f": "PD / Quick fuze", "b": "Functions on impact. HE/Q (mortars) or HE/PD (arty) against personnel and light-skinned vehicles."}, {"id": "b150", "c": "Shells & Fuzes", "f": "Delay fuze", "b": "Detonates 0.05 sec after impact (5-15 m penetration). Against overhead cover, heavy woods, or when minimal fragmentation is desired (friendlies close)."}, {"id": "b151", "c": "Shells & Fuzes", "f": "PROX / NSB fuze", "b": "Radio proximity fuze. NSB bursts 0-3 ft; PROX 3-13 ft. HE/PROX is optimal against personnel in the open (60/81/HIMARS)."}, {"id": "b152", "c": "Shells & Fuzes", "f": "VT fuze", "b": "Variable Time radio fuze, about 7 m height of burst; optimal against personnel in the open (155mm/HIMARS)."}, {"id": "b153", "c": "Shells & Fuzes", "f": "Time fuze", "b": "Used with WP, illum, and HE."}, {"id": "b154", "c": "Shells & Fuzes", "f": "Asset/ammo match: troops in the open", "b": "HE with PROX/NSB (mortars) or VT (155)."}, {"id": "b155", "c": "Shells & Fuzes", "f": "Asset/ammo match: enemy under overhead cover or in thick woods", "b": "HE/Delay."}, {"id": "b156", "c": "Shells & Fuzes", "f": "Asset/ammo match: armor", "b": "ICM/DPICM (155 or HIMARS)."}, {"id": "b157", "c": "Shells & Fuzes", "f": "Asset/ammo match: screen a movement", "b": "WP, RP (81mm), or M825 smoke (155)."}, {"id": "b158", "c": "Targeting", "f": "Targeting", "b": "Meticulous, deliberate process of selecting fires objectives and matching the appropriate response, considering operational requirements and asset capabilities; based on METT-T."}, {"id": "b159", "c": "Targeting", "f": "Target (definition)", "b": "Any object, person, group, or force marked for destruction, damage, injury, or capture because of its use in the enemy's military endeavor."}, {"id": "b160", "c": "Targeting", "f": "Planned target vs target of opportunity", "b": "Planned: planned before execution (in the AA or ORP). Opportunity: unforeseen, engaged with a call for fire."}, {"id": "b161", "c": "Targeting", "f": "Four types of planned targets", "b": "On-call, scheduled, priority, final protective fire (FPF)."}, {"id": "b162", "c": "Targeting", "f": "On-call target", "b": "Coordinated with higher (COC); has a target number; predetermined munitions delivered when requested; flexible timing (e.g., defense). Radio: 'Fire Tgt # AB1000.'"}, {"id": "b163", "c": "Targeting", "f": "Scheduled target", "b": "An on-call target with a set time. Radio: 'Set TOT Tgt # AB1001 for 1500.'"}, {"id": "b164", "c": "Targeting", "f": "Priority target", "b": "Used in offense (patrol, movement to contact). Takes priority over all other requests; guns are laid on it; maneuver commander designates and shifts it (establish/cancel)."}, {"id": "b165", "c": "Targeting", "f": "Priority target vs FPF rule", "b": "A firing unit can have a priority target OR an FPF, not both."}, {"id": "b166", "c": "Targeting", "f": "Final protective fire (FPF)", "b": "Defense only (the only priority target in the defense). Prearranged barrier to stop enemy movement across defensive lines. Always linear. One per firing unit; guns laid on it."}, {"id": "b167", "c": "Targeting", "f": "Who can order the FPF?", "b": "Only the unit's Commanding Officer or, in their absence, the next most senior Marine present."}, {"id": "b168", "c": "Targeting", "f": "Order of precedence when planning targets", "b": "Known -> Suspected -> Likely enemy positions."}, {"id": "b169", "c": "Targeting", "f": "Known / Suspected / Likely enemy position", "b": "Known: located with certainty and currently visible. Suspected: located without certainty, or accurately located but mobile and may have moved. Likely: based only on METT-TC analysis ('where would I put them?')."}, {"id": "b170", "c": "Targeting", "f": "Point target", "b": "Cross (tick mark) symbol; 6-digit alphanumeric label in the upper right quadrant; at least a 6-digit grid; 200 m or less in length/width; drawn in black."}, {"id": "b171", "c": "Targeting", "f": "Linear target", "b": "Line with end marks; label above it; three components: center grid, length, attitude; length greater than 200 m and less than 600 m; drawn in black."}, {"id": "b172", "c": "Targeting", "f": "Linear target length formula", "b": "Number of tubes x ECR (planning width)."}, {"id": "b173", "c": "Targeting", "f": "Linear length - 60mm section", "b": "3 x 30 m = 90 m."}, {"id": "b174", "c": "Targeting", "f": "Linear length - 81mm platoon / section", "b": "Platoon: 8 x 35 = 280 m. Section: 4 x 35 = 140 m."}, {"id": "b175", "c": "Targeting", "f": "Linear length - 155mm battery", "b": "6 x 50 = 300 m."}, {"id": "b176", "c": "Targeting", "f": "ECR (effective casualty radius)", "b": "Despite the name, it is the DIAMETER/width of the casualty-producing area of one round."}, {"id": "b177", "c": "Targeting", "f": "Attitude", "b": "Orientation of a linear/rectangular target in mils grid, always 0-3199 (never 3200-6399). Nearest 100 mils is sufficient."}, {"id": "b178", "c": "Targeting", "f": "How to calculate attitude (4 steps)", "b": "1) Plot the center grid 2) Draw the target orientation line from center to the RIGHT 3) Center the protractor on the center grid 4) Read where the line crosses the right side (0000-3199)."}, {"id": "b179", "c": "Targeting", "f": "Mils for cardinal directions", "b": "N = 0, E = 1600, S = 3200, W = 4800 (6400 mils in a circle)."}, {"id": "b180", "c": "Targeting", "f": "Three fire support planning considerations", "b": "Enemy threat rings, risk estimate distances, requesting and coordinating fires (COC coordination)."}, {"id": "b181", "c": "Targeting", "f": "Enemy threat rings", "b": "Distance the enemy's weapons can have accurate effects; ideally engage with fires before friendlies enter them. A consideration, not the determining factor."}, {"id": "b182", "c": "Targeting", "f": "Risk estimate distance (RED)", "b": "Minimum distance friendlies can be from friendly fires without catastrophic casualties (0.1% probability of incapacitation). A hard limit - not the same as 'danger close', which is a warning."}, {"id": "b183", "c": "Targeting", "f": "RED - 60mm (standing/prone)", "b": "1/3 max range 150/140 m; 2/3 max range 155/145 m; max range 175/165 m."}, {"id": "b184", "c": "Targeting", "f": "RED - 81mm (standing/prone)", "b": "1/3 max range 190/175 m; 2/3 max range 210/195 m; max range 220/205 m."}, {"id": "b185", "c": "Targeting", "f": "RED - 155mm (standing/prone)", "b": "1/3 max range 385/355 m; 2/3 max range 515/485 m; max range 730/710 m."}, {"id": "b186", "c": "Targeting", "f": "List of Targets", "b": "A REQUEST from a subordinate unit to the COC listing targets needed to support the SOM. Has NO target numbers."}, {"id": "b187", "c": "Targeting", "f": "Target-List Worksheet", "b": "Consolidated, approved list from higher with redundancies removed. HAS assigned target numbers."}, {"id": "b188", "c": "Targeting", "f": "TLWS - size column by target type", "b": "Point: no dimensions. Linear: length only. Rectangular: length and width. Circular: width (radius) only."}, {"id": "b189", "c": "Targeting", "f": "TLWS - schedule columns", "b": "Put '/' if the target is to be fired in a schedule; add '\\' (making an X) once scheduled."}, {"id": "b190", "c": "Targeting", "f": "TLWS - line number", "b": "Administrative control measure for passing data by radio/wire; assigned consecutively across pages."}, {"id": "b191", "c": "Fire Support Plan & TTLODAC", "f": "Priority of fires", "b": "Precedence for answering SIMULTANEOUS calls for fire. Units with priority usually plan priority targets or FPFs."}, {"id": "b192", "c": "Fire Support Plan & TTLODAC", "f": "Who develops the Fire Support Plan?", "b": "The FSCC at division, regiment, battalion; the FiST at company."}, {"id": "b193", "c": "Fire Support Plan & TTLODAC", "f": "Where is the FS plan briefed?", "b": "In the Execution paragraph, right after the scheme of maneuver."}, {"id": "b194", "c": "Fire Support Plan & TTLODAC", "f": "EFST - four parts", "b": "Task, Purpose, Method, Effects."}, {"id": "b195", "c": "Fire Support Plan & TTLODAC", "f": "EFST Task", "b": "Enemy-centric: the targeting objective against a specific enemy formation's function or capability."}, {"id": "b196", "c": "Fire Support Plan & TTLODAC", "f": "EFST Purpose", "b": "Friendly-focused 'why' - ties fires to the scheme of maneuver."}, {"id": "b197", "c": "Fire Support Plan & TTLODAC", "f": "EFST Method", "b": "How task and purpose are achieved; links sensor to shooter. From higher: Priority, Allocation, Restrictions. At platoon level, it becomes your TTLODAC."}, {"id": "b198", "c": "Fire Support Plan & TTLODAC", "f": "EFST Effects", "b": "Quantifies successful accomplishment - a measure of effectiveness."}, {"id": "b199", "c": "Fire Support Plan & TTLODAC", "f": "TTLODAC", "b": "Target, Trigger, Location, Observer, Delivery system, Attack guidance, Communication net."}, {"id": "b200", "c": "Fire Support Plan & TTLODAC", "f": "TTLODAC - Target", "b": "Target number (from TLWS) plus description prefixed known/suspected/likely."}, {"id": "b201", "c": "Fire Support Plan & TTLODAC", "f": "TTLODAC - Trigger", "b": "Condition to fire. NEVER 'on order' or 'on signal'. Observable, conditions-based, tied to terrain (e.g., 'as the platoon departs the assault position')."}, {"id": "b202", "c": "Fire Support Plan & TTLODAC", "f": "TTLODAC - Location", "b": "Grid zone plus at least a 6-digit grid (8 preferred); add length and attitude for linear targets."}, {"id": "b203", "c": "Fire Support Plan & TTLODAC", "f": "TTLODAC - Observer", "b": "Always a primary AND an alternate; the Marine who can best observe effects."}, {"id": "b204", "c": "Fire Support Plan & TTLODAC", "f": "TTLODAC - Delivery system", "b": "Primary and alternate fire support asset (e.g., Pri 81s / Alt 60s)."}, {"id": "b205", "c": "Fire Support Plan & TTLODAC", "f": "TTLODAC - Attack guidance", "b": "Ammunition, primary and alternate, matched to the delivery system (e.g., 81s HE/Q, 60s HE/PROX) plus special instructions."}, {"id": "b206", "c": "Fire Support Plan & TTLODAC", "f": "TTLODAC - Comm net", "b": "Net for each asset (e.g., 81s on BN Mortar Net, 60s on Co Mortar Net)."}, {"id": "b207", "c": "BAMCIS & METT-TC", "f": "Troop leading steps (BAMCIS)", "b": "Begin planning, Arrange for reconnaissance, Make reconnaissance, Complete the plan, Issue the order, Supervise."}, {"id": "b208", "c": "BAMCIS & METT-TC", "f": "Most important troop leading step", "b": "Supervise - continuous; ensures the plan is understood and executed as intended."}, {"id": "b209", "c": "BAMCIS & METT-TC", "f": "Begin planning (BAMCIS)", "b": "On receipt of mission: initial METT-TC analysis, build the timeline, issue the WARNO quickly."}, {"id": "b210", "c": "BAMCIS & METT-TC", "f": "Arrange vs Make reconnaissance", "b": "Arrange: decide how you will observe the enemy and terrain (maps, imagery, physical) and coordinate assets. Make: execute it to confirm/deny assumptions and update METT-TC."}, {"id": "b211", "c": "BAMCIS & METT-TC", "f": "Complete the plan / Issue the order", "b": "Complete: finalize SOM and FS plan, write the OPORD. Issue: deliver verbally with visual aids (terrain model, sketch) and confirm understanding."}, {"id": "b212", "c": "BAMCIS & METT-TC", "f": "METT-TC", "b": "Mission, Enemy, Terrain & weather, Troops & fire support available, Time, Civil considerations."}, {"id": "b213", "c": "BAMCIS & METT-TC", "f": "Mission analysis (METT-TC) - key questions", "b": "What is my task and purpose? What are specified and implied tasks? What limitations apply? What is the intent two levels up?"}, {"id": "b214", "c": "BAMCIS & METT-TC", "f": "1/3 - 2/3 rule", "b": "Leader uses 1/3 of available time for own planning and issuing the order; subordinates get 2/3."}, {"id": "b215", "c": "BAMCIS & METT-TC", "f": "1/3 - 2/3 example: 12 hours to prepare", "b": "You get 4 hours; subordinates get 8 hours."}, {"id": "b216", "c": "BAMCIS & METT-TC", "f": "SALUTE", "b": "Size, Activity, Location, Unit, Time, Equipment (reporting format)."}, {"id": "b217", "c": "BAMCIS & METT-TC", "f": "DRAW-D", "b": "Defend, Reinforce, Attack, Withdraw, Delay - possible enemy courses of action."}, {"id": "b218", "c": "BAMCIS & METT-TC", "f": "OCOKA-W", "b": "Observation & fields of fire, Cover & concealment, Obstacles, Key terrain, Avenues of approach, Weather."}, {"id": "b219", "c": "BAMCIS & METT-TC", "f": "Cover vs concealment", "b": "Cover protects from bullets/fragments; concealment hides from observation."}, {"id": "b220", "c": "BAMCIS & METT-TC", "f": "Key terrain", "b": "Any location whose seizure or control affords a marked advantage to either combatant."}, {"id": "b221", "c": "BAMCIS & METT-TC", "f": "Avenue of approach", "b": "Air or ground route of an attacking force leading to an objective or key terrain."}, {"id": "b222", "c": "BAMCIS & METT-TC", "f": "Obstacle", "b": "Any natural or man-made feature that stops, slows, or diverts military movement."}, {"id": "b223", "c": "BAMCIS & METT-TC", "f": "Weather factors to analyze", "b": "High/low temperatures, precipitation, sunrise/sunset, nautical twilight, effect on visibility, mobility, equipment."}, {"id": "b224", "c": "BAMCIS & METT-TC", "f": "ASCOPE", "b": "Areas, Structures, Capabilities, Organizations, People, Events (civil considerations)."}, {"id": "b225", "c": "BAMCIS & METT-TC", "f": "Center of gravity (CG)", "b": "The enemy's primary source of strength, will, or balance."}, {"id": "b226", "c": "BAMCIS & METT-TC", "f": "Critical vulnerability (CV)", "b": "A weakness that, if exploited, renders the enemy's center of gravity ineffective or vulnerable."}, {"id": "b227", "c": "BAMCIS & METT-TC", "f": "Exploitation plan", "b": "Your plan to attack the CV; it becomes the 'how' of the mission, the focus of the main effort, and the basis of the SOM and Commander's Intent."}, {"id": "b228", "c": "BAMCIS & METT-TC", "f": "EMLCOA - three things it answers", "b": "1) Enemy mission (tactical task + purpose) 2) Current activity 3) What they will do when we execute our mission (action on contact)."}, {"id": "b229", "c": "WARNO, OPORD & FRAGO", "f": "Warning Order (WARNO) - purpose", "b": "Preliminary notice with the best information available so subordinates can begin concurrent preparation and reconnaissance; issued as soon as possible."}, {"id": "b230", "c": "WARNO, OPORD & FRAGO", "f": "Immediate actions to build a WARNO", "b": "1) Develop a reverse-planned timeline (apply 1/3-2/3) 2) Quick METT-TC mental analysis 3) Draft and issue the WARNO quickly."}, {"id": "b231", "c": "WARNO, OPORD & FRAGO", "f": "WARNO minimum contents (Combat Orders handout)", "b": "Mission, Enemy situation, General instructions, Special instructions."}, {"id": "b232", "c": "WARNO, OPORD & FRAGO", "f": "What goes in a WARNO tentative SOM / coordinating instructions?", "b": "Best-available outline of the plan plus time-critical instructions (timeline, uniform/gear, rehearsals) so subordinates can prepare. (Detailed WARNO format is not in your handouts - see gaps list.)"}, {"id": "b233", "c": "WARNO, OPORD & FRAGO", "f": "Five-paragraph order (SMEAC)", "b": "Preceded by Orientation: Situation, Mission, Execution, Administration & Logistics, Command & Signal."}, {"id": "b234", "c": "WARNO, OPORD & FRAGO", "f": "Situation paragraph contents", "b": "Enemy forces (composition/disposition/strength, capabilities/limitations, EMLCOA); friendly forces (Higher, Adjacent, Supporting); attachments/detachments."}, {"id": "b235", "c": "WARNO, OPORD & FRAGO", "f": "HAS", "b": "Higher (higher's mission statement), Adjacent (adjacent units' tasking statements), Supporting (assets in support, their location and command relationship)."}, {"id": "b236", "c": "WARNO, OPORD & FRAGO", "f": "Mission paragraph", "b": "Verbatim from your unit's tasking statement in higher's order (task and purpose)."}, {"id": "b237", "c": "WARNO, OPORD & FRAGO", "f": "Execution paragraph contents", "b": "Commander's Intent; Concept of Operations (Scheme of Maneuver + Fire Support Plan); Tasks to subordinates; Coordinating Instructions."}, {"id": "b238", "c": "WARNO, OPORD & FRAGO", "f": "Commander's Intent - three parts", "b": "Purpose, Method, Endstate."}, {"id": "b239", "c": "WARNO, OPORD & FRAGO", "f": "Commander's Intent - Purpose", "b": "The 'why' of the mission, taken from your mission statement."}, {"id": "b240", "c": "WARNO, OPORD & FRAGO", "f": "Commander's Intent - Method", "b": "How the purpose is achieved, including the enemy CG/CV and how you will exploit it."}, {"id": "b241", "c": "WARNO, OPORD & FRAGO", "f": "Commander's Intent - Endstate", "b": "What success looks like for friendly forces, the enemy, and the terrain after the action."}, {"id": "b242", "c": "WARNO, OPORD & FRAGO", "f": "Platoon scheme of maneuver format", "b": "Parts-based. Each part: Begins with / Ends with / Critical events / Conditions set."}, {"id": "b243", "c": "WARNO, OPORD & FRAGO", "f": "Squad scheme of maneuver format", "b": "DDFTC: Distribution of forces, Direction of attack, Form of maneuver, TCMs, Consolidation plan. Then briefed TCM to TCM."}, {"id": "b244", "c": "WARNO, OPORD & FRAGO", "f": "Briefing TCM to TCM", "b": "For each leg: Order of movement (OOM), Formation of movement (FOM), Direction of movement (DOM - azimuth and distance)."}, {"id": "b245", "c": "WARNO, OPORD & FRAGO", "f": "Tasking statement format", "b": "Unit + condition (when) + tactical task + where + 'in order to' purpose. Minimum: condition, tactical task, purpose."}, {"id": "b246", "c": "WARNO, OPORD & FRAGO", "f": "5 Ws of a tasking statement", "b": "Who, What (tactical task), When (condition), Where, Why (purpose)."}, {"id": "b247", "c": "WARNO, OPORD & FRAGO", "f": "Break down: '1st Squad (SE1), upon suppression from 60mm mortars, suppress Plt Obj 1 IOT allow the main effort to maneuver.'", "b": "Who: 1st Squad (SE1). When: upon 60mm suppression. What: suppress. Where: Plt Obj 1. Why: allow the ME to maneuver."}, {"id": "b248", "c": "WARNO, OPORD & FRAGO", "f": "Break down: '2nd Squad, NLT 0530, seize Objective Bravo IOT prevent the enemy from withdrawing north.'", "b": "Who: 2nd Squad. When: NLT 0530. What: seize. Where: Objective Bravo. Why: prevent enemy withdrawal north."}, {"id": "b249", "c": "WARNO, OPORD & FRAGO", "f": "Admin & Logistics - the 4 Bs", "b": "Beans (rations), Bullets (ammo), Band-aids (CASEVAC/CCP), Bad guys (EPWs)."}, {"id": "b250", "c": "WARNO, OPORD & FRAGO", "f": "Which B covers detainees?", "b": "Bad guys (EPWs)."}, {"id": "b251", "c": "WARNO, OPORD & FRAGO", "f": "Handling EPWs - the 5 S's", "b": "Search, Silence, Segregate, Safeguard, Speed to the rear."}, {"id": "b252", "c": "WARNO, OPORD & FRAGO", "f": "Command & Signal contents", "b": "Command: location of key leaders, succession of command. Signal: signal plan (signals reinforce conditions)."}, {"id": "b253", "c": "WARNO, OPORD & FRAGO", "f": "Using standard terms and graphics", "b": "Say 'occupy SBF 1 at grid 1234 5678 and initiate fires on my command,' not 'set up on that hill and shoot' - and depict it on an overlay."}, {"id": "b254", "c": "WARNO, OPORD & FRAGO", "f": "Fragmentary Order (FRAGO)", "b": "Abbreviated order modifying a previously issued order in a changing situation; communicates ONLY what has changed."}, {"id": "b255", "c": "WARNO, OPORD & FRAGO", "f": "FRAGO minimum contents", "b": "Mission and Execution paragraphs."}, {"id": "b256", "c": "WARNO, OPORD & FRAGO", "f": "FRAGO trigger", "b": "Analyze what has changed from the previous order to determine what to communicate."}, {"id": "b257", "c": "Unit Readiness Planning", "f": "Purpose of all training (MCDP 1)", "b": "To develop forces that can win in combat; training is the focus of effort of a peacetime military."}, {"id": "b258", "c": "Unit Readiness Planning", "f": "Training mandate", "b": "The nation must have units ready for combat; the intended battle determines training direction and goals."}, {"id": "b259", "c": "Unit Readiness Planning", "f": "Training imperative", "b": "Training is a profess   else h.rows.forEach((r, i) => body.push(version(i === h.rows.length - 1 ? "Original" : "Earlier version", r.edited_by, r.version_at, r.front, r.back, r.category, r)));
  return el("section", { class: "panel", id: "histPanel" },
    el("div", { class: "toolbar" }, el("h3", { text: "Edit history" }), el("button", { class: "btn", type: "button", text: "Close", onclick: () => { S.hist = null; render(); } })),
    el("div", { class: "hist" }, body));
}
async function restore(card, row) {
  const h = S.hist;
  if (h.armed !== row.id) { h.armed = row.id; render(); setTimeout(() => { if (S.hist && S.hist.armed === row.id) { S.hist.armed = null; render(); } }, 4000); return; }
  const cur = findCard(card.key);
  try {
    const saved = await patchCard(cur, { front: row.front, back: row.back, category: ALL_CATS.includes(row.category) ? row.category : USER_CAT, edited_by: (myName() || "Anonymous") + " (restored)" });
    if (!saved) { await loadCards(); h.error = "The card changed since you opened the history. Reopen History and try again."; render(); return; }
    S.formMsg = { kind: "ok", text: "Earlier version restored." };
    openHistory(saved);
  } catch (e) { console.error(e); h.error = "The restore didn't save. Try again."; render(); }
}

/* ---------- views ---------- */
function statusView(title, body) { return el("div", { class: "emptybox" }, el("strong", { text: title }), el("p", { text: body, style: "margin:6px 0 0" })); }
function gateView() {
  return el("section", { class: "panel gate" },
    el("h3", { text: "Add one card to unlock the deck" }),
    el("p", { class: "lede", text: `${S.cards.length} cards are waiting. To get in, contribute one card of your own with your name on it. Once you're in, you can also edit any card in the deck.` }),
    S.loadError === "network" ? el("p", { class: "msg err", text: "Couldn't reach the card store. You can still try submitting; reload if it fails." }) : null,
    cardForm(true),
    el("div", { class: "example" }, el("b", { text: "Good targets for your card" }),
      "Anything from the \"Awaiting handouts\" categories: call for fire, patrolling, offense, defense, overlays, grenades and pyro, hand and arm signals."));
}
function notices() {
  const out = [];
  if (S.loadError === "config") out.push(el("p", { class: "msg err", text: "Setup needed: paste your Supabase URL and anon key into index.html. Until then the deck is read-only and nobody can add cards." }));
  if (S.loadError === "noseed") out.push(el("p", { class: "msg err", text: "The base cards aren't in the database yet, so only submitted cards can be edited. Run supabase-setup.sql to load them." }));
  if (S.loadError === "network" && S.loaded) out.push(el("p", { class: "msg err", text: "Couldn't reach the card store, so you're seeing a saved copy. Editing is off until the page reconnects." }));
  return out;
}
function actions(c, small) {
  const cls = small ? "mini" : "btn";
  const bits = [];
  if (!c.base && c.by) bits.push(el("span", { class: "chip", text: "Added by " + c.by }));
  if (c.editedBy) bits.push(el("span", { class: "chip cat-chip", text: "Edited by " + c.editedBy }));
  if (c.suggested && c.c === USER_CAT) bits.push(el("span", { class: "chip cat-chip", text: "Suggested: " + c.suggested }));
  if (c.editable && S.loadError !== "network") {
    bits.push(el("button", { class: cls, type: "button", text: "Edit", onclick: () => startEdit(c) }));
    bits.push(el("button", { class: cls, type: "button", text: "History", onclick: () => openHistory(c) }));
  }
  return bits;
}
function studyView() {
  const list = currentList();
  const out = [el("div", { class: "toolbar" },
    el("h2", { text: S.cat === "All" ? "All cards" : S.cat }),
    el("div", { class: "row" },
      el("div", { class: "seg", role: "group", "aria-label": "View" },
        el("button", { "aria-pressed": S.mode === "study" ? "true" : "false", onclick: () => { S.mode = "study"; render(); }, text: "Study" }),
        el("button", { "aria-pressed": S.mode === "list" ? "true" : "false", onclick: () => { S.mode = "list"; render(); }, text: "List" })),
      CONFIGURED ? el("button", { class: "btn primary", onclick: () => { S.showAdd = true; S.edit = null; S.hist = null; S.formMsg = null; render(); }, text: "Add a card" }) : null))];
  out.push(...notices());
  if (S.showAdd) out.push(el("section", { class: "panel" }, el("h3", { text: "Add a card" }), el("p", { class: "lede", text: "It lands in User Created with your name on it." }), cardForm(false)), el("div", { class: "spacer" }));
  else if (S.formMsg && S.formMsg.kind === "ok") out.push(el("p", { class: "msg ok", text: S.formMsg.text }));

  const editing = S.edit && findCard(S.edit.key);
  const history = S.hist && findCard(S.hist.key);

  if (S.mode === "list") {
    if (editing) out.push(editPanel(editing), el("div", { class: "spacer" }));
    if (history) out.push(histPanel(history), el("div", { class: "spacer" }));
    if (!list.length) { out.push(emptyFor()); return out; }
    out.push(el("div", { class: "list" }, list.map(c => el("div", { class: "item" + ((editing && editing.key === c.key) || (history && history.key === c.key) ? " active" : "") },
      el("div", { class: "t", text: c.f }), el("div", { class: "d", text: c.b }),
      el("div", { class: "sub" }, S.cat === "All" ? el("span", { class: "chip cat-chip", text: c.c }) : null, actions(c, true))))));
    return out;
  }

  if (!list.length) { out.push(emptyFor()); return out; }
  S.idx = Math.min(S.idx, list.length - 1);
  const c = list[S.idx];
  if (editing && editing.key === c.key) { out.push(editPanel(c)); return out; }

  const meta = side => el("div", { class: "meta" }, el("span", { text: c.c }), el("span", { text: side }));
  const flash = el("button", { class: "flash" + (S.flipped ? " flipped" : ""), type: "button", "aria-label": S.flipped ? "Answer shown. Activate to show the term." : "Term shown. Activate to show the answer.", onclick: () => { S.flipped = !S.flipped; flash.classList.toggle("flipped", S.flipped); } },
    el("div", { class: "face front" }, meta("Front"), el("div", { class: "term", text: c.f }), el("div", { class: "hint", text: "Tap or press Space to flip" })),
    el("div", { class: "face back" }, meta("Back"), el("div", { class: "def", text: c.b }), c.base ? el("div", { class: "hint", text: "← → to move between cards" }) : el("div", { class: "byline", text: "Added by " + (c.by || "a contributor") })));
  out.push(el("div", { class: "progress", role: "progressbar", "aria-valuemin": "1", "aria-valuemax": String(list.length), "aria-valuenow": String(S.idx + 1), "aria-label": "Position in deck" }, el("span", { style: `width:${((S.idx + 1) / list.length * 100).toFixed(2)}%` })));
  out.push(el("div", { class: "stage" }, flash));
  out.push(el("div", { class: "controls" },
    el("div", { class: "row" }, el("button", { class: "btn", onclick: () => step(-1), text: "← Previous" }), el("button", { class: "btn", onclick: () => step(1), text: "Next →" })),
    el("span", { class: "counter", text: `${S.idx + 1} / ${list.length}` }),
    el("div", { class: "row" },
      el("button", { class: "btn", onclick: () => { S.order = shuffleArr(cardsIn(S.cat).map(x => x.key)); S.idx = 0; S.flipped = false; S.hist = null; render(); }, text: "Shuffle" }),
      S.order ? el("button", { class: "btn", onclick: () => { S.order = null; S.idx = 0; S.flipped = false; S.hist = null; render(); }, text: "In order" }) : null)));
  out.push(el("div", { class: "row card-actions" }, actions(c, false)));
  if (history && history.key === c.key) out.push(el("div", { class: "spacer" }), histPanel(c));
  return out;
}
function emptyFor() {
  return GAP.has(S.cat)
    ? statusView("No cards here yet.", "None of the handouts so far cover this objective. Add a card from your notes.")
    : statusView("No cards here yet.", S.cat === USER_CAT ? "New cards show up here until someone files them into a category with Edit." : "Pick another category.");
}
function step(d) { const n = currentList().length; if (!n) return; S.idx = (S.idx + d + n) % n; S.flipped = false; S.hist = null; render(); }

function render() {
  renderTally(); renderRail();
  const v = $("#view"); v.replaceChildren();
  if (!S.loaded) { v.append(statusView("Loading the deck…", "Getting the latest cards.")); return; }
  if (!unlocked()) { v.append(gateView()); return; }
  v.append(...studyView());
}

document.addEventListener("keydown", e => {
  if (!unlocked() || S.mode !== "study" || S.showAdd || S.edit) return;
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  if (e.key === "ArrowRight") { e.preventDefault(); step(1); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); step(-1); }
  else if (e.key === " " && e.target.tagName !== "BUTTON") { e.preventDefault(); const f = $(".flash"); if (f) f.click(); }
});
/* Pick up other people's edits when you come back to the tab (skipped while you're typing). */
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && S.loaded && CONFIGURED && !S.edit && !S.showAdd && !S.busy) loadCards();
});

render();
loadCards();
</script>
