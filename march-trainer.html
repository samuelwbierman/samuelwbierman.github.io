<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MARCH TRAINER — TCCC Skills Drill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil:wght@700;900&family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#20241c;
    --bg-panel:#2a2f22;
    --bg-panel-raised:#333a28;
    --od:#4b5320;
    --od-dark:#3a4019;
    --tan:#cdbb95;
    --orange:#ff7a29;
    --orange-dim:#a8531f;
    --text:#e9e5d6;
    --text-dim:#9aa085;
    --fail:#c1453a;
    --pass:#7a9a53;
    --line: rgba(233,229,214,0.14);
    --radius: 3px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 20% -10%, rgba(255,122,41,0.06), transparent 40%),
      var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }
  .stencil{
    font-family:'Big Shoulders Stencil',sans-serif;
    font-weight:900;
    text-transform:uppercase;
    letter-spacing:0.02em;
  }
  .mono{ font-family:'IBM Plex Mono',monospace; }

  #app{ max-width:640px; margin:0 auto; padding:18px 16px 60px; }

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    border-bottom:3px solid var(--orange);
    padding-bottom:10px; margin-bottom:18px;
  }
  .topbar .brand{ display:flex; align-items:center; gap:10px; }
  .topbar .badge{
    width:34px;height:34px;border:2px solid var(--tan);border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:11px; font-weight:700; color:var(--tan); flex-shrink:0;
  }
  .topbar h1{ font-size:26px; margin:0; line-height:0.95; color:var(--tan); }
  .topbar .sub{ font-size:10px; color:var(--text-dim); letter-spacing:0.12em; margin-top:2px;}
  .stepdot{
    display:flex; gap:4px;
  }
  .stepdot span{
    width:7px;height:7px;border-radius:50%;background:var(--line);
  }
  .stepdot span.done{ background:var(--pass); }
  .stepdot span.now{ background:var(--orange); }

  .card{
    background:var(--bg-panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:20px;
    margin-bottom:16px;
    position:relative;
  }
  .card::before{
    content:attr(data-tag);
    position:absolute; top:-11px; left:14px;
    background:var(--orange); color:#1a1c14;
    font-family:'IBM Plex Mono',monospace; font-weight:600;
    font-size:11px; letter-spacing:0.08em;
    padding:2px 8px; border-radius:2px;
  }
  .card h2{
    margin:6px 0 12px; font-size:21px; color:var(--tan);
  }
  .card p.lead{ color:var(--text); font-size:15px; line-height:1.5; margin-top:0;}
  .scenario-box{
    background:var(--od-dark); border-left:3px solid var(--orange);
    padding:12px 14px; border-radius:2px; font-size:14px; line-height:1.55;
    margin-bottom:14px; color:var(--text);
  }
  .scenario-box b{ color:var(--orange); }

  button.opt{
    display:block; width:100%; text-align:left;
    background:var(--bg-panel-raised); color:var(--text);
    border:1px solid var(--line); border-radius:2px;
    padding:12px 14px; margin-bottom:8px; font-size:14.5px;
    font-family:'Inter',sans-serif; cursor:pointer;
    transition:border-color .12s, background .12s;
  }
  button.opt:hover{ border-color:var(--orange); background:#3a4130; }
  button.opt:focus-visible{ outline:2px solid var(--orange); outline-offset:1px; }
  button.opt.correct{ border-color:var(--pass); background:rgba(122,154,83,0.18); }
  button.opt.wrong{ border-color:var(--fail); background:rgba(193,69,58,0.18); }
  button.opt[disabled]{ cursor:default; }

  .multitag{
    display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:10px;
    color:var(--text-dim); border:1px solid var(--line); border-radius:2px;
    padding:1px 6px; margin-right:6px; vertical-align:middle;
  }

  .feedback{
    margin-top:12px; padding:12px 14px; border-radius:2px; font-size:14px; line-height:1.5;
    border:1px solid var(--line);
  }
  .feedback.pass{ border-color:var(--pass); background:rgba(122,154,83,0.12); }
  .feedback.fail{ border-color:var(--fail); background:rgba(193,69,58,0.12); }
  .feedback b{ display:block; font-family:'IBM Plex Mono',monospace; font-size:11px;
    letter-spacing:0.08em; margin-bottom:4px; text-transform:uppercase; }
  .feedback.pass b{ color:var(--pass); }
  .feedback.fail b{ color:var(--fail); }

  .primary-btn{
    background:var(--orange); color:#20241c; border:none; font-weight:700;
    padding:12px 20px; border-radius:2px; cursor:pointer; font-size:14.5px;
    font-family:'Inter',sans-serif;
  }
  .primary-btn:hover{ background:#ff8c46; }
  .primary-btn:disabled{ background:#5a5240; color:#a0a08c; cursor:not-allowed; }
  .ghost-btn{
    background:transparent; color:var(--tan); border:1px solid var(--line);
    padding:12px 20px; border-radius:2px; cursor:pointer; font-size:14.5px;
    font-family:'Inter',sans-serif;
  }
  .ghost-btn:hover{ border-color:var(--tan); }

  .btnrow{ display:flex; gap:10px; margin-top:16px; flex-wrap:wrap; }

  /* body diagram for blood sweep */
  .figure-wrap{ display:flex; justify-content:center; margin:8px 0 14px; }
  .figure-wrap svg{ max-width:220px; width:100%; }
  .zone{ fill:var(--bg-panel-raised); stroke:var(--line); stroke-width:1.5; cursor:pointer; transition:fill .12s; }
  .zone:hover{ fill:#3a4130; }
  .zone.hit{ fill:var(--fail); }
  .zone.miss{ fill:var(--od-dark); opacity:0.6; }
  .zone.correctzone{ fill:var(--pass); }

  /* order/sequence list */
  .seqlist{ list-style:none; padding:0; margin:0 0 6px; }
  .seqlist li{
    background:var(--bg-panel-raised); border:1px solid var(--line); border-radius:2px;
    padding:11px 12px; margin-bottom:6px; font-size:14px; display:flex; align-items:center; gap:10px;
    cursor:grab; user-select:none;
  }
  .seqlist li .num{
    font-family:'IBM Plex Mono',monospace; color:var(--orange); font-weight:600; font-size:13px; width:18px;
  }
  .seqlist li.dragging{ opacity:0.4; }
  .seqlist li.over{ border-color:var(--orange); }

  /* checklist replica */
  table.replica{ width:100%; border-collapse:collapse; font-size:12.5px; margin-top:6px;}
  table.replica th{
    background:var(--od); color:var(--tan); font-family:'IBM Plex Mono',monospace;
    font-size:10.5px; text-transform:uppercase; letter-spacing:0.05em;
    padding:6px 8px; text-align:left;
  }
  table.replica td{ padding:7px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  table.replica td.mark{ text-align:center; font-weight:700; width:34px; }
  table.replica td.mark.p{ color:var(--pass); }
  table.replica td.mark.f{ color:var(--fail); }
  table.replica td.crit{ color:var(--orange); font-family:'IBM Plex Mono',monospace; font-weight:700; text-align:center; width:24px; }

  .prof-banner{
    text-align:center; padding:16px; margin:16px 0; border-radius:3px; font-family:'Big Shoulders Stencil',sans-serif;
    font-size:26px; font-weight:900; letter-spacing:0.03em;
  }
  .prof-banner.yes{ background:rgba(122,154,83,0.18); border:2px solid var(--pass); color:var(--pass); }
  .prof-banner.no{ background:rgba(193,69,58,0.18); border:2px solid var(--fail); color:var(--fail); }

  .helptext{ font-size:12.5px; color:var(--text-dim); margin-top:8px; }
  .kbd{ font-family:'IBM Plex Mono',monospace; background:var(--bg-panel-raised); border:1px solid var(--line);
    padding:1px 5px; border-radius:2px; font-size:11px;}

  select.msel{
    width:100%; background:var(--bg-panel-raised); color:var(--text); border:1px solid var(--line);
    border-radius:2px; padding:10px; font-size:14px; margin-bottom:10px; font-family:'Inter',sans-serif;
  }
  .field-label{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--orange); letter-spacing:0.06em;
    text-transform:uppercase; display:block; margin-bottom:4px; }

  footer{ text-align:center; color:var(--text-dim); font-size:11px; margin-top:30px; line-height:1.6; }

  .rankwrap{ margin-bottom:6px; }
  .rankrow{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px; }
  .ranktitle{ font-size:20px; color:var(--orange); }
  .rankxp{ font-size:12px; color:var(--text-dim); }
  .rankbar{ height:10px; background:var(--bg-panel-raised); border:1px solid var(--line); border-radius:6px; overflow:hidden; }
  .rankbar-fill{ height:100%; background:linear-gradient(90deg, var(--orange-dim), var(--orange)); transition:width .4s ease; }
  .rankhelp{ font-size:11px; color:var(--text-dim); margin-top:5px; }
  .rankstats{ font-size:11.5px; color:var(--text-dim); margin:8px 0 2px; }

  .ptbadge{
    display:inline-block; margin-left:6px; font-family:'IBM Plex Mono',monospace; font-size:11px;
    font-weight:600; color:var(--pass); background:rgba(122,154,83,0.15);
    border:1px solid var(--pass); border-radius:10px; padding:1px 8px;
    animation: popin .25s ease-out;
  }
  .ptbadge.fail{ color:var(--fail); background:rgba(193,69,58,0.15); border-color:var(--fail); }
  @keyframes popin{ from{ transform:scale(0.85); opacity:0; } to{ transform:scale(1); opacity:1; } }

  .cardreplica{
    border:2px solid var(--tan); border-radius:2px; background:var(--bg-panel-raised);
    padding:2px;
  }
  .cr-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:9px 12px; border-bottom:1px dashed var(--line);
    font-size:13.5px;
  }
  .cr-row:last-child{ border-bottom:none; }
  .cr-label{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.05em; }
  .cr-val{ color:var(--orange); font-weight:600; text-align:right; }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================================================
   MARCH TRAINER — a scenario-driven drill on the ASM TCCC
   "Rapid Casualty Assessment" skills checklist (#TCCC-ASM-12-01).
   Vanilla JS, single file, no build step — safe to drop straight
   into a GitHub repo and serve with GitHub Pages.
   ============================================================ */

const CASUALTY_RANKS = ['Cpl.','LCpl.','Sgt.','PFC','Pvt.'];
const CASUALTY_LASTNAMES = ['Reyes','Okafor','Delgado','Whitfield','Nakamura','Boyle','Petrov','Adeyemi','Kowalski','Marsh'];
function randomCasualtyName(){
  const r = CASUALTY_RANKS[Math.floor(Math.random()*CASUALTY_RANKS.length)];
  const l = CASUALTY_LASTNAMES[Math.floor(Math.random()*CASUALTY_LASTNAMES.length)];
  return `${r} ${l}`;
}

// ---- Hard Mode correct-answer text (self-graded, no keyword matching) ----
function sceneSafetyAnswerText(sc){
  return sc.stillUnderFire ? 'Return fire and get to cover before approaching' : 'Scan the area for secondary hazards before approaching';
}
function movementAnswerText(needsMove){
  return needsMove ? 'Yes — move/drag to cover, then continue care' : 'No — treat in place, the scene is secure and casualty is stable';
}
function docAnswerText(sc){
  return sc.documentation==='card' ? 'DD Form 1380 / TCCC Card' : "Write it on the casualty's forehead";
}
function treatmentCorrectText(sc){
  return sc.id==='gsw' ? 'Tourniquet applied, airway/breathing checked, IV access, casualty insulated'
    : sc.id==='blast' ? 'Airway secured, chest checked, wound packed/dressed, IV access, casualty insulated'
    : sc.id==='rollover' ? 'Forearm bleeding dressed, breathing reassessed for rib injury, casualty insulated'
    : sc.id==='drowning' ? 'Scalp bleeding controlled, airway/breathing supported, aggressive rewarming'
    : sc.id==='pinned' ? 'Tourniquet applied — everything else deferred until behind cover'
    : 'Airway protected, oral bleeding controlled, casualty monitored for shock';
}
function tqAnswerText(sc){
  return sc.tqLocation ? `Tourniquet — ${sc.tqLocation}` : 'No tourniquet — pressure dressing/wound pack used instead';
}
const AVPU_OPTIONS_STATIC = { A:'A — Alert', V:'V — responds to Voice', P:'P — responds to Pain', U:'U — Unresponsive' };
function avpuAnswerText(sc){
  return AVPU_OPTIONS_STATIC[sc.avpu];
}


const SCENARIOS = [
  {
    id:'gsw',
    title:'Care Under Fire — GSW, Right Thigh',
    brief:"Your platoon is taking sporadic fire from a tree line 150m out. {name} goes down after small-arms contact. He's conscious, yelling, and grabbing at his right thigh. Blood is pooling fast under him.",
    responsive:true,
    stillUnderFire:true,
    equipmentAvailable:true,
    bleed:{zone:'leftLeg', label:'right thigh (shown mirrored on the figure)', wording:'a spurting wound on the right thigh'},
    marchFindings:{
      M:'Arterial bleed, right thigh — massive hemorrhage.',
      A:'Airway is clear; casualty is talking.',
      R:'Breathing is fast but unlabored, no chest wounds.',
      C:'Radial pulse present but thready — early shock.',
      H:'No head trauma. Ground is wet; hypothermia risk if care is prolonged.'
    },
    interventions:[
      {id:'tq', text:'Apply a tourniquet high and tight on the injured limb', correctOrder:1, letter:'M'},
      {id:'airway', text:'Reposition/open the airway if needed', correctOrder:2, letter:'A'},
      {id:'chestseal', text:'Check for and seal any open chest wounds', correctOrder:3, letter:'R'},
      {id:'ivio', text:'Establish IV/IO access if in shock', correctOrder:4, letter:'C'},
      {id:'warm', text:'Prevent hypothermia — insulate/cover the casualty', correctOrder:5, letter:'H'}
    ],
    secondaryInjuries:['none-obvious'],
    documentation:'card', // DD1380/TCCC card available
    mechanism:'GSW',
    tqLocation:'R Leg' // tourniquet applied — right thigh, shown as R Leg box on the card
  },
  {
    id:'pinned',
    title:'Care Under Fire — Pinned Down, Massive Hemorrhage',
    brief:"Your squad is pinned down in a sustained firefight from a fortified position 80m out. {name} takes a round to the left arm and is bleeding heavily. Suppressive fire is still coming in — there's no way to render full care where he's lying.",
    responsive:true,
    stillUnderFire:true,
    equipmentAvailable:false,
    bleed:{zone:'leftArm', label:'left upper arm', wording:'a heavy, spurting bleed on the left arm'},
    marchFindings:{
      M:'Massive hemorrhage, left arm — the only thing you can address before reaching cover.',
      A:'Airway is clear; he\u2019s conscious and talking, but a full check waits until you\u2019re behind cover.',
      R:'Breathing looks adequate for now — reassess once you\u2019re not taking fire.',
      C:'Pulse strong at the moment, but that can change fast — reassess once safe.',
      H:'No way to address hypothermia risk while still exposed — revisit once behind cover.'
    },
    interventions:[
      {id:'tq6', text:'Apply a tourniquet high and tight on the bleeding arm — the one thing you do before moving', correctOrder:1, letter:'M'},
      {id:'airway6', text:'Once behind cover: check/open the airway if needed', correctOrder:2, letter:'A'},
      {id:'chest6', text:'Once behind cover: check for and seal any chest wounds', correctOrder:3, letter:'R'},
      {id:'ivio6', text:'Once behind cover: establish IV/IO access if in shock', correctOrder:4, letter:'C'},
      {id:'warm6', text:'Once behind cover: prevent hypothermia — insulate/cover the casualty', correctOrder:5, letter:'H'}
    ],
    secondaryInjuries:['none-obvious'],
    documentation:'forehead',
    mechanism:'GSW',
    tqLocation:'L Arm'
  },
  {
    id:'blast',
    title:'Tactical Field Care — IED Blast, Multiple Casualties',
    brief:"A pressure-plate IED detonates near your patrol. The blast has stopped and no one's firing on you, but nobody's swept the area yet. {name} is on the ground, not responding to your voice. You see frag wounds to both legs, singed eyebrows, and soot around his mouth.",
    responsive:false,
    stillUnderFire:false,
    equipmentAvailable:false,
    bleed:{zone:'rightLeg', label:'left lower leg', wording:'steady bleeding from a frag wound, left lower leg'},
    marchFindings:{
      M:'Moderate bleeding, left lower leg — not spurting.',
      A:'Soot around the mouth, possible airway burn — at risk.',
      R:'Breathing shallow and irregular.',
      C:'Pulse weak and rapid.',
      H:'Unresponsive; core temp drop risk is high lying on the ground.'
    },
    interventions:[
      {id:'airway2', text:'Open/secure the airway (recovery position or adjunct)', correctOrder:1, letter:'A'},
      {id:'chestseal2', text:'Check for and seal any open chest wounds', correctOrder:2, letter:'R'},
      {id:'pressuredress', text:'Control the leg bleeding with a pressure dressing/wound pack', correctOrder:3, letter:'M'},
      {id:'ivio2', text:'Establish IV/IO access', correctOrder:4, letter:'C'},
      {id:'warm2', text:'Prevent hypothermia — insulate/cover the casualty', correctOrder:5, letter:'H'}
    ],
    secondaryInjuries:['eye','burns'],
    documentation:'forehead', // no 1380 on hand
    mechanism:'IED',
    tqLocation:null // pressure dressing used, not a tourniquet
  },
  {
    id:'rollover',
    title:'Tactical Field Care — Vehicle Rollover, Arm Laceration & Rib Injury',
    brief:"Your MRAP rolls after striking a culvert on a night resupply run. {name} is pulled from the wreckage conscious, gripping his left arm, wincing with every breath from what looks like cracked ribs.",
    responsive:true,
    stillUnderFire:false,
    equipmentAvailable:true,
    bleed:{zone:'leftArm', label:'left forearm', wording:'a laceration on the left forearm, steady bleeding'},
    marchFindings:{
      M:'Steady bleeding, left forearm laceration.',
      A:'Airway clear, casualty talking.',
      R:'Breathing shallow and painful — suspected rib fracture, no visible chest wound.',
      C:'Pulse strong but elevated from pain.',
      H:'Alert; cold night air makes hypothermia a real risk during extended care.'
    },
    interventions:[
      {id:'dress3', text:'Control the forearm bleeding with a pressure dressing', correctOrder:1, letter:'M'},
      {id:'airway3', text:'Confirm the airway stays clear as pain limits his breathing', correctOrder:2, letter:'A'},
      {id:'chestcheck3', text:'Reassess breathing and check for a chest wound given the rib pain', correctOrder:3, letter:'R'},
      {id:'ivio3', text:'Monitor circulation / establish IV access if shock develops', correctOrder:4, letter:'C'},
      {id:'warm3', text:'Prevent hypothermia — insulate and cover the casualty', correctOrder:5, letter:'H'}
    ],
    secondaryInjuries:['fractures'],
    documentation:'card',
    mechanism:'MVC',
    tqLocation:null
  },
  {
    id:'drowning',
    title:'Field Care — Cold-Water Near-Drowning',
    brief:"During a river crossing exercise, {name} goes under after the ice gives way. Your team pulls him out unresponsive, skin pale, not breathing normally.",
    responsive:false,
    stillUnderFire:false,
    equipmentAvailable:true,
    bleed:{zone:'head', label:'scalp', wording:'a scalp laceration from the ice, minor but worth finding on the sweep'},
    marchFindings:{
      M:'Minor scalp bleeding, easily controlled.',
      A:'Airway compromised — unresponsive, needs to be opened/cleared.',
      R:'Breathing is agonal; needs support.',
      C:'Pulse slow, weak, skin cold.',
      H:'Severe hypothermia — the primary threat to life here alongside airway.'
    },
    interventions:[
      {id:'dress4', text:'Control the scalp bleeding', correctOrder:1, letter:'M'},
      {id:'airway4', text:'Open and clear the airway, support breathing as needed', correctOrder:2, letter:'A'},
      {id:'breathcheck4', text:'Reassess breathing effort and rate', correctOrder:3, letter:'R'},
      {id:'ivio4', text:'Check circulation, gain IV/IO access if trained and available', correctOrder:4, letter:'C'},
      {id:'warm4', text:'Aggressively rewarm — remove wet clothing, use a hypothermia wrap', correctOrder:5, letter:'H'}
    ],
    secondaryInjuries:['head'],
    documentation:'card',
    mechanism:'Other',
    tqLocation:null
  },
  {
    id:'facial',
    title:'Tactical Field Care — Facial/Airway Blast Trauma',
    brief:"A secondary blast catches your squad during a compound clear. {name} takes shrapnel to the face and jaw. He's conscious, spitting blood, and struggling to keep his own airway clear.",
    responsive:true,
    stillUnderFire:false,
    equipmentAvailable:false,
    bleed:{zone:'head', label:'face/jaw', wording:'oral bleeding from jaw and facial shrapnel wounds'},
    marchFindings:{
      M:'Oral bleeding, controllable with positioning and direct pressure.',
      A:'Airway at risk from blood and swelling — the top priority here.',
      R:'Breathing adequate once the airway is protected.',
      C:'Pulse strong, no signs of shock.',
      H:'Alert and warm; low hypothermia risk in this environment.'
    },
    interventions:[
      {id:'bleed5', text:'Control oral bleeding and position to protect the airway', correctOrder:1, letter:'M'},
      {id:'airway5', text:'Secure the airway — positioning or an airway adjunct as trained', correctOrder:2, letter:'A'},
      {id:'breathcheck5', text:'Confirm adequate breathing once the airway is clear', correctOrder:3, letter:'R'},
      {id:'ivio5', text:'Reassess circulation for shock', correctOrder:4, letter:'C'},
      {id:'warm5', text:'Monitor for hypothermia given prolonged care', correctOrder:5, letter:'H'}
    ],
    secondaryInjuries:['fractures'],
    documentation:'forehead',
    mechanism:'IED',
    tqLocation:null
  }
];

// ---- run history (persisted locally per browser) ----
const HISTORY_KEY = 'marchTrainerHistory_v1';
function loadHistory(){
  try{
    const raw = localStorage.getItem(HISTORY_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return [];
}
function saveHistory(list){
  try{ localStorage.setItem(HISTORY_KEY, JSON.stringify(list.slice(-50))); }catch(e){}
}

// ---- checklist item metadata (mirrors the real ASM card) ----
const CHECKLIST_ITEMS = [
  {n:1, label:'Verbalized appropriate scene safety precautions to address immediate life threats.', critical:false},
  {n:2, label:'Assessed the casualty for responsiveness.', critical:false},
  {n:3, label:'Identified options for casualty movement, if necessary.', critical:false},
  {n:4, label:'Performed a blood sweep on the casualty to identify life-threatening bleeding.', critical:true},
  {n:5, label:'Verbalized the meaning of MARCH and used the sequence to perform a casualty assessment.', critical:true},
  {n:6, label:'Verbalized the necessary lifesaving interventions in the correct order based on the scenario.', critical:true},
  {n:7, label:'Described secondary injuries that may be present and identified appropriate interventions.', critical:true},
  {n:8, label:'Communicated findings and medical aid provided to medical responders.', critical:true},
  {n:9, label:'Documented medical aid rendered on a DD Form 1380, TCCC Card, or casualty\u2019s forehead.', critical:true}
];

let state = {
  screen:'title',
  scenario:null,
  results:{}, // item n -> true/false
  history: loadHistory(),
  runFinalized:false,
  historyIndex:null, // which saved run is open in the detail view
  hardMode:false
};

function go(screen){
  if(screen==='debrief' && !state.runFinalized) finalizeRun();
  state.screen = screen; render(); window.scrollTo(0,0);
}

function finalizeRun(){
  const sc = state.scenario;
  const proficient = CHECKLIST_ITEMS.every(item => !item.critical || !!state.results[item.n]);
  state.history.push({
    ts: Date.now(),
    scenarioTitle: sc.title,
    casualtyName: sc.casualtyName,
    results: {...state.results},
    proficient
  });
  saveHistory(state.history);
  state.runFinalized = true;
}

function setResult(n, pass){
  state.results[n] = pass;
}

function pickScenario(){
  const s = SCENARIOS[Math.floor(Math.random()*SCENARIOS.length)];
  const scenario = JSON.parse(JSON.stringify(s));
  const name = randomCasualtyName();
  scenario.brief = scenario.brief.replace(/\{name\}/g, name);
  scenario.casualtyName = name;
  scenario.avpu = scenario.responsive ? 'A' : 'U';
  state.scenario = scenario;
  state.results = {};
  state.runFinalized = false;
  go('s1');
}

function pctDone(){
  const order = ['s1','s2','s3','s4','s5','s6','s7','s8','s9'];
  const idx = order.indexOf(state.screen);
  return idx<0?0:idx;
}

function stepDots(){
  const order = ['s1','s2','s3','s4','s5','s6','s7','s8','s9'];
  const cur = order.indexOf(state.screen);
  return `<div class="stepdot">` + order.map((o,i)=>{
    let cls='';
    if(i<cur) cls='done'; else if(i===cur) cls='now';
    return `<span class="${cls}"></span>`;
  }).join('') + `</div>`;
}

function esc(s){ return (s+'').replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
function shuffleArr(arr){ return [...arr].sort(()=>Math.random()-0.5); }

/* ---------------- render ---------------- */
function render(){
  const app = document.getElementById('app');
  let html = '';
  html += `<div class="topbar">

      <div>

  </div>`;

  html += renderScreen();

  html += `<footer>Built for platoon TCCC refreshers. Not a substitute for certified TCCC-ASM instruction or the official DHA checklist.</footer>`;
  app.innerHTML = html;
  bindScreen();
}

function renderScreen(){
  switch(state.screen){

/* ---------- DEBRIEF ---------- */
function checklistTableHTML(results){
  let critPass = true;
  const rows = CHECKLIST_ITEMS.map(item=>{
    const passed = !!results[item.n];
    if(item.critical && !passed) critPass = false;
    return `<tr>
      <td>${item.n}. ${item.label}</td>
      <td class="crit">${item.critical?'C':''}</td>
      <td class="mark ${passed?'p':''}">${passed?'P':''}</td>
      <td class="mark ${!passed?'f':''}">${!passed?'F':''}</td>
    </tr>`;
  }).join('');
  const allAnswered = Object.keys(results).length >= 9;
  const proficient = allAnswered && critPass;
  return { rows, allAnswered, proficient };
}

  <div class="card" data-tag="REFERENCE &middot; DD 1380">
    <h2>How the card should read</h2>
    <p class="lead" style="margin-bottom:12px;">A quick recap of the key fields for this casualty — compare against what you picked in Step 8.</p>

    <p class="lead" style="margin-bottom:14px;">This score card has been saved — find it any time under Compare Past Grades.</p>

      <button class="primary-btn" id="retryBtn">Run Another Scenario</button>
      <button class="ghost-btn" id="titleBtn">Back to Title</button>
    </div>
  </div>`;
}

/* ---------- HISTORY (list of past attempts) ---------- */
function fmtDate(ts){
  const d = new Date(ts);
  return d.toLocaleDateString(undefined,{month:'short',day:'numeric'}) + ' ' + d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});
}
function screenHistory(){
  if(!state.history.length){
    return `
    <div class="card" data-tag="PAST GRADES">
      <h2>No runs yet</h2>
      <p class="lead">Score cards show up here once you finish a scenario.</p>
      <div class="btnrow">
        <button class="primary-btn" id="startBtn2">Start New Scenario</button>
        <button class="ghost-btn" id="titleBtn2">Back to Title</button>
      </div>
    </div>`;
  }
  const items = [...state.history].reverse().map((h, i)=>{
    const idx = state.history.length - 1 - i; // real index into state.history
    return `
    <button class="opt histrow" data-idx="${idx}" style="display:flex;justify-content:space-between;align-items:center;">
      <span>
        <span style="display:block;font-weight:600;">${esc(h.scenarioTitle)}</span>
        <span style="display:block;font-size:12px;color:var(--text-dim);">${esc(h.casualtyName||'')} &middot; ${fmtDate(h.ts)}</span>
      </span>
      <span class="multitag" style="color:${h.proficient?'var(--pass)':'var(--fail)'};border-color:${h.proficient?'var(--pass)':'var(--fail)'};">${h.proficient?'PASS':'NO-GO'}</span>
    </button>`;
  }).join('');
  return `
  <div class="card" data-tag="PAST GRADES">
    <h2>Compare Past Grades</h2>
    <p class="lead">Tap a run to see the full score card.</p>
    ${items}
    <div class="btnrow">
      <button class="ghost-btn" id="clearHistBtn">Clear History</button>
      <button class="ghost-btn" id="titleBtn2">Back to Title</button>
    </div>
  </div>`;
}

/* ---------- HISTORY DETAIL (one saved score card) ---------- */
function screenHistoryDetail(){
  const h = state.history[state.historyIndex];
  if(!h) return `<div class="card" data-tag="PAST GRADES"><p class="lead">That run couldn\u2019t be found.</p><div class="btnrow"><button class="ghost-btn" id="backHistBtn">Back to List</button></div></div>`;

  <div class="card" data-tag="SAVED SCORE CARD">
    <h2>${esc(h.scenarioTitle)}</h2>

      <tr><th>Rapid Casualty Assessment</th><th>C</th><th>P</th><th>F</th></tr>
      ${rows}
    </table>

    <div class="btnrow">

/* ---------- shared option-button helper ---------- */
function optButtons(opts, onPick, nextScreen){
  const shuffled = shuffleArr(opts);
  window.__optHandler = {opts:shuffled, onPick, nextScreen};
  return `<div id="optWrap">${shuffled.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o.t)}</button>`).join('')}</div>
  <div class="btnrow" id="revealRow"><button class="ghost-btn" id="revealBtn">Show Answer</button></div>
  <div id="stepFeedback"></div>
  <div class="btnrow" id="stepNext" style="display:none;"><button class="primary-btn" id="nextBtn">Continue</button></div>`;
}
function feedbackHTML(pass, title, msg){
  return `<div class="feedback ${pass?'pass':'fail'}"><b>${title}</b>${esc(msg)}</div>`;
}

/* ---------- shared Hard Mode single-field text step ---------- */
function hardTextStep(ids, placeholder){
  return `
  <input type="text" id="${ids.input}" class="msel" placeholder="${esc(placeholder)}" autocomplete="off">
  <div class="btnrow">
    <button class="primary-btn" id="${ids.grade}">Grade</button>
  </div>
  <div id="${ids.feedback}"></div>
  <div class="btnrow" id="${ids.nextRow}" style="display:none;"><button class="primary-btn" id="${ids.nextBtn}">Continue</button></div>`;
}
function selfGradeHTML(answerLabel, answerHTML){
  return `<div class="feedback" style="border-color:var(--tan);"><b>${esc(answerLabel)}</b>${answerHTML}</div>
  <p class="lead" style="margin:12px 0 8px;font-size:14px;">Did you get it right?</p>`;
}
function bindHardTextStep(cfg){
  const inputEl = document.getElementById(cfg.input);
  const gradeBtn = document.getElementById(cfg.grade);
  const feedbackEl = document.getElementById(cfg.feedback);
  const nextRow = document.getElementById(cfg.nextRow);
  const nextBtn = document.getElementById(cfg.nextBtn);
  function showNext(){
    nextRow.style.display='flex';
    nextBtn.onclick = ()=> go(cfg.nextScreen);
  }
  gradeBtn.onclick = ()=>{
    inputEl.disabled = true;
    gradeBtn.disabled = true;
    feedbackEl.innerHTML = selfGradeHTML('Correct answer', esc(cfg.correctText))
      + `<div class="btnrow">
          <button class="primary-btn" id="${cfg.input}_yes">I got it right</button>
          <button class="ghost-btn" id="${cfg.input}_no">I got it wrong</button>
        </div>`;
    document.getElementById(cfg.input+'_yes').onclick = ()=>{
      setResult(cfg.itemN, true);
      feedbackEl.innerHTML = feedbackHTML(true, 'Marked Correct', 'Self-graded \u2014 nice work.');
      showNext();
    };
    document.getElementById(cfg.input+'_no').onclick = ()=>{
      setResult(cfg.itemN, false);
      feedbackEl.innerHTML = feedbackHTML(false, 'Marked Incorrect', 'Self-graded \u2014 review the correct answer before moving on.');
      showNext();
    };
  };
}

/* ---------- bind interactivity per screen ---------- */
function bindScreen(){
  if(state.screen==='title'){
    document.getElementById('startBtn').onclick = ()=> pickScenario();
    document.getElementById('historyBtn').onclick = ()=> go('history');
    document.getElementById('hardModeToggle').onchange = (e)=>{ state.hardMode = e.target.checked; };
    return;
  }

  if(['s1','s2','s3','s9'].includes(state.screen) && state.hardMode){
    const sc = state.scenario;
    if(state.screen==='s1'){
      bindHardTextStep({
        input:'s1Input', grade:'s1Grade', feedback:'s1Feedback', nextRow:'s1NextRow', nextBtn:'s1NextBtn',
        nextScreen:'s2', itemN:1,
        correctText: sceneSafetyAnswerText(sc)
      });
    } else if(state.screen==='s2'){
      bindHardTextStep({
        input:'s2Input', grade:'s2Grade', feedback:'s2Feedback', nextRow:'s2NextRow', nextBtn:'s2NextBtn',
        nextScreen:'s3', itemN:2,
        correctText:'Shout and give a physical stimulus (tap/shake, sternal rub)'
      });
    } else if(state.screen==='s3'){
      const needsMove = sc.stillUnderFire || !sc.responsive;
      bindHardTextStep({
        input:'s3Input', grade:'s3Grade', feedback:'s3Feedback', nextRow:'s3NextRow', nextBtn:'s3NextBtn',
        nextScreen:'s4', itemN:3,
        correctText: movementAnswerText(needsMove)
      });
    } else if(state.screen==='s9'){
      bindHardTextStep({
        input:'s9Input', grade:'s9Grade', feedback:'s9Feedback', nextRow:'s9NextRow', nextBtn:'s9NextBtn',
        nextScreen:'debrief', itemN:9,
        correctText: docAnswerText(sc)
      });
    }
    return;
  }

  if(['s1','s2','s3','s9'].includes(state.screen)){
    const wrap = document.getElementById('optWrap');
    const buttons = wrap.querySelectorAll('button.opt');
    buttons.forEach(btn=>{
      btn.onclick = ()=>{
        if(btn.disabled) return;
        buttons.forEach(b=>b.disabled=true);
        document.getElementById('revealRow').style.display='none';
        const i = +btn.dataset.i;
        const opt = window.__optHandler.opts[i];
        btn.classList.add(opt.correct?'correct':'wrong');
        const msg = window.__optHandler.onPick(i,opt,false);
        document.getElementById('stepFeedback').innerHTML =
          feedbackHTML(opt.correct, opt.correct?'Pass':'Needs work', msg);
        document.getElementById('stepNext').style.display='flex';
        document.getElementById('nextBtn').onclick = ()=> go(window.__optHandler.nextScreen);
      };
    });
    document.getElementById('revealBtn').onclick = ()=>{
      buttons.forEach(b=>b.disabled=true);
      document.getElementById('revealRow').style.display='none';
      const correctIdx = window.__optHandler.opts.findIndex(o=>o.correct);
      const opt = window.__optHandler.opts[correctIdx];
      buttons[correctIdx].classList.add('correct');
      const msg = window.__optHandler.onPick(correctIdx, opt, true);
      document.getElementById('stepFeedback').innerHTML =
        feedbackHTML(false, 'Shown \u2014 not scored as a pass', msg);
      document.getElementById('stepNext').style.display='flex';
      document.getElementById('nextBtn').onclick = ()=> go(window.__optHandler.nextScreen);
    };
    return;
  }

  if(state.screen==='s4'){
    const zones = document.querySelectorAll('.zone');
    const tapped = new Set();
    const correctZone = state.scenario.bleed.zone;
    let found = false;
    zones.forEach(z=>{
      z.onclick = ()=>{
        if(found) return;
        tapped.add(z.dataset.zone);
        if(z.dataset.zone===correctZone){
          z.classList.add('hit');
          found = true;
          setResult(4, true);
          document.getElementById('sweepRevealRow').style.display='none';
          document.getElementById('sweepFeedback').innerHTML =
            feedbackHTML(true, 'Pass', `Found it — ${state.scenario.bleed.wording}. A systematic head-to-toe sweep is exactly how you catch bleeding hidden by gear or position in the real world.`);
          document.getElementById('sweepNext').style.display='flex';
        } else {
          z.classList.add('miss');
        }
      };
    });
    document.getElementById('sweepRevealBtn').onclick = ()=>{
      if(found) return;
      found = true;
      zones.forEach(z=>{ if(z.dataset.zone===correctZone) z.classList.add('correctzone'); });
      setResult(4, false);
      document.getElementById('sweepRevealRow').style.display='none';
      document.getElementById('sweepFeedback').innerHTML =
        feedbackHTML(false, 'Shown \u2014 not scored as a pass', `The bleed was here: ${state.scenario.bleed.wording}. Marked incomplete since it wasn\u2019t found on your own sweep.`);
      document.getElementById('sweepNext').style.display='flex';
    };
    document.getElementById('toStep5').onclick = ()=> go('s5');
    return;
  }

  if(state.screen==='s5' && state.hardMode){
    document.getElementById('checkMarch').onclick = ()=>{
      const inputs = document.querySelectorAll('.march-hard-input');
      inputs.forEach(inp=> inp.disabled = true);
      document.getElementById('checkMarch').disabled = true;
      const answerList = ['M','A','R','C','H'].map(L=>`<div style="margin-top:4px;"><b>${L}</b> — ${esc(MARCH_OPTIONS[L][0])}</div>`).join('');
      document.getElementById('marchFeedback').innerHTML =
        selfGradeHTML('Correct answers', answerList)
        + `<div class="btnrow">
            <button class="primary-btn" id="marchYes">I got it right</button>
            <button class="ghost-btn" id="marchNo">I got it wrong</button>
          </div>`;
      document.getElementById('marchYes').onclick = ()=>{
        setResult(5, true);
        document.getElementById('marchFeedback').innerHTML = feedbackHTML(true, 'Marked Correct', 'Self-graded \u2014 nice work.')
          + `<div class="btnrow"><button class="primary-btn" id="toStep6">Continue</button></div>`;
        document.getElementById('toStep6').onclick = ()=> go('s6');
      };
      document.getElementById('marchNo').onclick = ()=>{
        setResult(5, false);
        document.getElementById('marchFeedback').innerHTML = feedbackHTML(false, 'Marked Incorrect', 'Self-graded \u2014 review the correct answers above before moving on.')
          + `<div class="btnrow"><button class="primary-btn" id="toStep6">Continue</button></div>`;
        document.getElementById('toStep6').onclick = ()=> go('s6');
      };
    };
    return;
  }

  if(state.screen==='s5'){
    document.getElementById('checkMarch').onclick = ()=>{
      const selects = document.querySelectorAll('#marchForm select');
      let allCorrect = true;
      selects.forEach(s=>{ if(s.value!=='correct') allCorrect=false; });
      setResult(5, allCorrect);
      document.getElementById('marchRevealBtn').style.display='none';
      document.getElementById('marchFeedback').innerHTML =
        feedbackHTML(allCorrect, allCorrect?'Pass':'Needs work', allCorrect
          ? 'MARCH = Massive hemorrhage, Airway, Respiration, Circulation, Hypothermia/Head injury — and you\u2019ve got it down.'
          : 'MARCH stands for Massive hemorrhage, Airway, Respiration, Circulation, Hypothermia/Head injury. Review any letter you missed above.')
        + `<div class="btnrow"><button class="primary-btn" id="toStep6">Continue</button></div>`;
      document.getElementById('toStep6').onclick = ()=> go('s6');
    };
    document.getElementById('marchRevealBtn').onclick = ()=>{
      const selects = document.querySelectorAll('#marchForm select');
      selects.forEach(s=>{ s.value='correct'; s.disabled=true; });
      document.getElementById('checkMarch').disabled = true;
      document.getElementById('marchRevealBtn').style.display='none';
      setResult(5, false);
      document.getElementById('marchFeedback').innerHTML =
        feedbackHTML(false, 'Shown \u2014 not scored as a pass', 'MARCH = Massive hemorrhage, Airway, Respiration, Circulation, Hypothermia/Head injury. Marked incomplete since it was shown rather than recalled.')
        + `<div class="btnrow"><button class="primary-btn" id="toStep6">Continue</button></div>`;
      document.getElementById('toStep6').onclick = ()=> go('s6');
    };
    return;
  }

  if(state.screen==='s6'){
    const list = document.getElementById('seqlist');
    let dragEl = null;
    list.querySelectorAll('li').forEach(li=>{
      li.addEventListener('dragstart', ()=>{ dragEl = li; li.classList.add('dragging'); });
      li.addEventListener('dragend', ()=>{ li.classList.remove('dragging'); });
      li.addEventListener('dragover', (e)=>{
        e.preventDefault();
        const after = getDragAfter(list, e.clientY);
        if(after==null) list.appendChild(dragEl); else list.insertBefore(dragEl, after);
      });
    });
    function getDragAfter(container, y){
      const els = [...container.querySelectorAll('li:not(.dragging)')];
      return els.reduce((closest, child)=>{
        const box = child.getBoundingClientRect();
        const offset = y - box.top - box.height/2;
        if(offset < 0 && offset > closest.offset) return {offset, element: child};
        return closest;
      }, {offset:-Infinity}).element;
    }
    document.getElementById('checkSeq').onclick = ()=>{
      const ids = [...list.querySelectorAll('li')].map(li=>li.dataset.id);
      const correctIds = [...state.scenario.interventions].sort((a,b)=>a.correctOrder-b.correctOrder).map(iv=>iv.id);
      const correct = JSON.stringify(ids)===JSON.stringify(correctIds);
      setResult(6, correct);
      document.getElementById('seqRevealBtn').style.display='none';
      document.getElementById('seqFeedback').innerHTML =
        feedbackHTML(correct, correct?'Pass':'Needs work', correct
          ? 'Right order — you worked the MARCH sequence instead of treating whatever\u2019s most visible first.'
          : 'Order matters: work the letters in M-A-R-C-H sequence, treating the highest life threat before moving to the next.')
        + `<div class="btnrow"><button class="primary-btn" id="toStep7">Continue</button></div>`;
      document.getElementById('toStep7').onclick = ()=> go('s7');
    };
    document.getElementById('seqRevealBtn').onclick = ()=>{
      const correctOrder = [...state.scenario.interventions].sort((a,b)=>a.correctOrder-b.correctOrder);
      correctOrder.forEach(iv=>{
        const li = list.querySelector(`li[data-id="${iv.id}"]`);
        if(li){ li.draggable = false; list.appendChild(li); }
      });
      setResult(6, false);
      document.getElementById('checkSeq').disabled = true;
      document.getElementById('seqRevealBtn').style.display='none';
      document.getElementById('seqFeedback').innerHTML =
        feedbackHTML(false, 'Shown \u2014 not scored as a pass', 'The list above is now in the correct M-A-R-C-H order. Marked incomplete since it was shown rather than worked out.')
        + `<div class="btnrow"><button class="primary-btn" id="toStep7">Continue</button></div>`;
      document.getElementById('toStep7').onclick = ()=> go('s7');
    };
    return;
  }

  if(state.screen==='s7' && state.hardMode){
    const actual = state.scenario.secondaryInjuries.filter(s=>s!=='none-obvious');
    function secDetails(){
      return actual.length
        ? actual.map(id=>{
            const cat = SECONDARY_CATALOG.find(c=>c.id===id);
            return `<div style="margin-top:6px;"><b style="color:var(--orange)">${cat.label}:</b> ${esc(cat.intervention)}</div>`;
          }).join('')
        : `<div style="margin-top:6px;">No secondary injuries stood out in this scenario beyond the primary wound.</div>`;
    }
    const input = document.getElementById('secHardInput');
    document.getElementById('checkSec').onclick = ()=>{
      input.disabled = true;
      document.getElementById('checkSec').disabled = true;
      const answerLabel = actual.length ? actual.map(id=>SECONDARY_CATALOG.find(c=>c.id===id).label).join(', ') : 'None obvious';
      document.getElementById('secFeedback').innerHTML =
        selfGradeHTML('Correct answer', esc(answerLabel)) + secDetails()
        + `<div class="btnrow">
            <button class="primary-btn" id="secYes">I got it right</button>
            <button class="ghost-btn" id="secNo">I got it wrong</button>
          </div>`;
      document.getElementById('secYes').onclick = ()=>{
        setResult(7, true);
        document.getElementById('secFeedback').innerHTML = feedbackHTML(true, 'Marked Correct', 'Self-graded \u2014 nice work.')
          + `<div class="btnrow"><button class="primary-btn" id="toStep8">Continue</button></div>`;
        document.getElementById('toStep8').onclick = ()=> go('s8');
      };
      document.getElementById('secNo').onclick = ()=>{
        setResult(7, false);
        document.getElementById('secFeedback').innerHTML = feedbackHTML(false, 'Marked Incorrect', 'Self-graded \u2014 review the correct answer above before moving on.')
          + `<div class="btnrow"><button class="primary-btn" id="toStep8">Continue</button></div>`;
        document.getElementById('toStep8').onclick = ()=> go('s8');
      };
    };
    return;
  }

  if(state.screen==='s7'){
    const actual = state.scenario.secondaryInjuries.filter(s=>s!=='none-obvious');
    function secDetails(){
      return actual.length
        ? actual.map(id=>{
            const cat = SECONDARY_CATALOG.find(c=>c.id===id);
            return `<div style="margin-top:6px;"><b style="color:var(--orange)">${cat.label}:</b> ${esc(cat.intervention)}</div>`;
          }).join('')
        : `<div style="margin-top:6px;">No secondary injuries stood out in this scenario beyond the primary wound.</div>`;
    }
    document.getElementById('checkSec').onclick = ()=>{
      const checks = document.querySelectorAll('#secList input[type=checkbox]');
      const picked = [...checks].filter(c=>c.checked).map(c=>c.dataset.sec);
      const correct = picked.length===actual.length && picked.every(p=>actual.includes(p));
      setResult(7, correct);
      document.getElementById('secRevealBtn').style.display='none';
      document.getElementById('secFeedback').innerHTML =
        feedbackHTML(correct, correct?'Pass':'Needs work', correct?'You caught the right secondary injuries for this casualty.':'Compare against what was actually present below.')
        + secDetails()
        + `<div class="btnrow"><button class="primary-btn" id="toStep8">Continue</button></div>`;
      document.getElementById('toStep8').onclick = ()=> go('s8');
    };
    document.getElementById('secRevealBtn').onclick = ()=>{
      const checks = document.querySelectorAll('#secList input[type=checkbox]');
      checks.forEach(c=>{ c.checked = actual.includes(c.dataset.sec); c.disabled = true; });
      document.getElementById('checkSec').disabled = true;
      document.getElementById('secRevealBtn').style.display='none';
      setResult(7, false);
      document.getElementById('secFeedback').innerHTML =
        feedbackHTML(false, 'Shown \u2014 not scored as a pass', 'Marked incomplete since it was shown rather than identified on your own.')
        + secDetails()
        + `<div class="btnrow"><button class="primary-btn" id="toStep8">Continue</button></div>`;
      document.getElementById('toStep8').onclick = ()=> go('s8');
    };
    return;
  }

  if(state.screen==='s8' && state.hardMode){
    const sc = state.scenario;
    document.getElementById('checkMist').onclick = ()=>{
      ['mistMech','mistTq','mistAvpu','mistT'].forEach(id=> document.getElementById(id).disabled = true);
      document.getElementById('checkMist').disabled = true;
      const answerList = `
        <div style="margin-top:4px;"><b>Mechanism</b> — ${esc(sc.mechanism)}</div>
        <div style="margin-top:4px;"><b>Tourniquet</b> — ${esc(tqAnswerText(sc))}</div>
        <div style="margin-top:4px;"><b>AVPU</b> — ${esc(avpuAnswerText(sc))}</div>
        <div style="margin-top:4px;"><b>Treatment</b> — ${esc(treatmentCorrectText(sc))}</div>`;
      document.getElementById('mistFeedback').innerHTML =
        selfGradeHTML('Correct answers', answerList)
        + `<div class="btnrow">
            <button class="primary-btn" id="mistYes">I got it right</button>
            <button class="ghost-btn" id="mistNo">I got it wrong</button>
          </div>`;
      document.getElementById('mistYes').onclick = ()=>{
        setResult(8, true);
        document.getElementById('mistFeedback').innerHTML = feedbackHTML(true, 'Marked Correct', 'Self-graded \u2014 nice work.')
          + `<div class="btnrow"><button class="primary-btn" id="toStep9">Continue</button></div>`;
        document.getElementById('toStep9').onclick = ()=> go('s9');
      };
      document.getElementById('mistNo').onclick = ()=>{
        setResult(8, false);
        document.getElementById('mistFeedback').innerHTML = feedbackHTML(false, 'Marked Incorrect', 'Self-graded \u2014 review the correct answers above before moving on.')
          + `<div class="btnrow"><button class="primary-btn" id="toStep9">Continue</button></div>`;
        document.getElementById('toStep9').onclick = ()=> go('s9');
      };
    };
    return;
  }

  if(state.screen==='s8'){
    const ids=['mistMech','mistTq','mistAvpu','mistT'];
    document.getElementById('checkMist').onclick = ()=>{
      const correct = ids.every(id=>document.getElementById(id).value==='correct');
      setResult(8, correct);
      document.getElementById('mistRevealBtn').style.display='none';
      document.getElementById('mistFeedback').innerHTML =
        feedbackHTML(correct, correct?'Pass':'Needs work', correct
          ? 'Clean handoff — mechanism, tourniquet status, AVPU, and treatment all match what actually happened, exactly what the receiving team needs off the card.'
          : 'Every field on the card matters to the next provider — check whichever one you missed above (mechanism, tourniquet, AVPU, or treatment).')
        + `<div class="btnrow"><button class="primary-btn" id="toStep9">Continue</button></div>`;
      document.getElementById('toStep9').onclick = ()=> go('s9');
    };
    document.getElementById('mistRevealBtn').onclick = ()=>{
      ids.forEach(id=>{
        const sel = document.getElementById(id);
        sel.value = 'correct';
        sel.disabled = true;
      });
      document.getElementById('checkMist').disabled = true;
      document.getElementById('mistRevealBtn').style.display='none';
      setResult(8, false);
      document.getElementById('mistFeedback').innerHTML =
        feedbackHTML(false, 'Shown \u2014 not scored as a pass', 'Every field above now shows the correct entry. Marked incomplete since it was shown rather than filled in from your own assessment.')
        + `<div class="btnrow"><button class="primary-btn" id="toStep9">Continue</button></div>`;
      document.getElementById('toStep9').onclick = ()=> go('s9');
    };
    return;
  }

  if(state.screen==='debrief'){
    document.getElementById('retryBtn').onclick = pickScenario;
    document.getElementById('titleBtn').onclick = ()=> go('title');
    return;
  }

  if(state.screen==='history'){
    if(!state.history.length){
      document.getElementById('startBtn2').onclick = pickScenario;
      document.getElementById('titleBtn2').onclick = ()=> go('title');
      return;
    }
    document.querySelectorAll('.histrow').forEach(btn=>{
      btn.onclick = ()=>{
        state.historyIndex = +btn.dataset.idx;
        go('historyDetail');
      };
    });
    document.getElementById('clearHistBtn').onclick = ()=>{
      if(confirm('Clear all saved score cards on this device?')){
        state.history = [];
        saveHistory(state.history);
        render();
      }
    };
    document.getElementById('titleBtn2').onclick = ()=> go('title');
    return;
  }

  if(state.screen==='historyDetail'){
    const backBtn = document.getElementById('backHistBtn');
    if(backBtn) backBtn.onclick = ()=> go('history');
    return;
  }
}

render();
</script>
</body>
</html>
